<!doctype html>
<meta charset="utf-8">
<title>Retail MKT Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- App instalable (PWA): en el celular o iPad se agrega a la pantalla de inicio y abre a pantalla completa -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#020617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MKT Hub">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
/* Estética de Plan Contenidos: tema oscuro fijo (slate-950), paneles redondeados, degradados cian→azul */
:root{
  color-scheme:dark;
  --bg:#020617; --panel:rgba(15,23,42,.95); --inner:#020617; --inner-2:rgba(2,6,23,.4);
  --line:rgba(51,65,85,.7); --line-2:#1e293b; --line-3:#334155;
  --ink:#f1f5f9; --white:#ffffff; --muted:#94a3b8; --faint:#64748b;
  --cyan:#22d3ee; --cyan-5:#06b6d4; --blue:#2563eb; --blue-5:#3b82f6;
  --good:#34d399; --bad:#f87171; --warn:#fbbf24;
  --b-superseis:#22c55e; --b-stock:#3b82f6; --b-delimarket:#f59e0b;
  --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:256px;flex:none;border-right:1px solid var(--line-2);background:rgba(2,6,23,.95);backdrop-filter:blur(4px);padding:20px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(to bottom right,#22d3ee,#2563eb);box-shadow:0 10px 15px -3px rgba(6,182,212,.2)}
.logo-mark img{width:44px;height:44px;display:block}
.logo-mark{background:none!important;box-shadow:none!important;width:44px!important;height:44px!important}
.logo b{display:block;color:#fff;font-size:16px;font-weight:600;line-height:1.2}
.logo small{font-size:12px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.2em;padding:0 12px 2px;color:rgba(34,211,238,.6)}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;transition:all .15s}
.nav a svg{width:16px;height:16px;flex:none}
.nav a:hover{background:rgba(30,41,59,.8);color:#fff}
.nav a.on{background:linear-gradient(to right,#2563eb,#06b6d4);color:#fff;font-weight:600;box-shadow:0 4px 6px -1px rgba(6,182,212,.2)}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;background:rgba(248,113,113,.15);color:#fca5a5;border:1px solid rgba(248,113,113,.4);border-radius:99px;padding:0 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.15em}
.side-foot select{width:100%}
.logout{border:1px solid rgba(51,65,85,.6);background:transparent;border-radius:12px;padding:10px 12px;text-align:left;color:var(--faint);font-size:14px;transition:all .15s}
.logout:hover{background:rgba(30,41,59,.8);color:#cbd5e1}
/* Main */
.main{flex:1;min-width:0}
.content{max-width:1280px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:rgba(34,211,238,.8);margin:0 0 -18px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;color:#fff;margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--faint);margin:4px 0 0;font-size:14px}
h2{font-size:17px;margin:0 0 14px;font-weight:600;color:#fff}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 20px 25px -5px rgba(0,0,0,.2),0 8px 10px -6px rgba(0,0,0,.2)}
.panel.flush{padding:0;overflow:hidden}
.panel-h{padding:20px}
.panel-h.cyan{background:linear-gradient(to right,rgba(6,182,212,.2),rgba(59,130,246,.1),transparent)}
.panel-h.fuchsia{background:linear-gradient(to right,rgba(217,70,239,.2),rgba(168,85,247,.1),transparent)}
.panel-h h2{font-size:20px;font-weight:700;margin:0}
.panel-b{padding:16px}
.demo{border-color:rgba(6,182,212,.4);background:rgba(8,51,68,.35);display:flex;gap:12px;align-items:center;padding:14px 18px}
.demo svg{color:var(--cyan);width:20px;height:20px;flex:none}
.demo b{color:#cffafe}
.demo span{color:rgba(207,250,254,.8);font-size:13.5px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.kpi{padding:16px}
.kpi .l{color:var(--muted);font-size:14px}
.kpi .n{margin-top:4px;font-size:24px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:4px;font-size:12px;color:var(--faint)}
.up{color:var(--good)!important} .down{color:var(--bad)!important} .warn{color:var(--warn)!important}
.num{font-variant-numeric:tabular-nums}
/* pills */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--c) 60%,white);background:color-mix(in srgb,var(--c) 90%,transparent);color:var(--t,#020617)}
.brand{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;color:#e2e8f0}
.brand::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.net{font-size:11px;color:#cbd5e1;border:1px solid var(--line-3);background:var(--inner);border-radius:8px;padding:1px 6px}
.btn{border:1px solid var(--line-3);background:#0f172a;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:500;color:#e2e8f0;white-space:nowrap;transition:all .15s}
.btn:hover{background:#1e293b;color:#fff}
.btn:active,.primary:active{transform:scale(.98)}
.btn.primary{border:0;background:linear-gradient(to right,#06b6d4,#3b82f6);color:#fff;font-weight:600;box-shadow:0 10px 15px -3px rgba(6,182,212,.2)}
.btn.primary:hover{background:linear-gradient(to right,#22d3ee,#60a5fa)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-3);background:#0f172a;border-radius:12px;padding:6px 14px;font-size:13px;color:#cbd5e1;transition:all .15s}
.chip:hover{background:#1e293b;color:#fff}
.chip.on{border-color:transparent;background:linear-gradient(to right,#2563eb,#06b6d4);color:#fff;font-weight:600;box-shadow:0 4px 6px -1px rgba(6,182,212,.2)}
select.base{border:1px solid var(--line-3);background:var(--inner);border-radius:16px;padding:8px 12px;color:#f1f5f9;outline:none;transition:border-color .15s}
select.base:focus{border-color:var(--cyan)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 20px 25px -5px rgba(0,0,0,.2);scrollbar-width:thin;scrollbar-color:#334155 transparent}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:600;padding:14px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:#e2e8f0}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(30,41,59,.45)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stage{background:var(--inner-2);border:1px solid var(--line-2);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.stage .n{font-size:26px;font-weight:700;color:#fff}
.stage .l{font-size:12.5px;color:var(--muted)}
.pipe-note{font-size:12.5px;color:var(--faint);margin-top:12px}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line-2);background:var(--inner-2);border-radius:16px;transition:border-color .15s}
.row:hover{border-color:var(--line-3)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;color:#fff;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .date{font-size:12px;font-weight:700;color:var(--cyan);min-width:40px}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--c);box-shadow:0 0 10px var(--c)}
.empty{color:var(--faint);font-size:13px;padding:8px 2px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(min(230px,100%),1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:230px}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;color:#fff;padding:6px 8px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.col-h .num{background:rgba(2,6,23,.6);border-radius:99px;padding:0 8px;font-size:12px}
.card{background:var(--inner);border:1px solid var(--line-3);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#475569}
.card .bar-top{height:4px;background:var(--c)}
.card .in{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.card .t{font-weight:600;color:#fff}
.card .m{font-size:12px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card select{font-size:12px;border:1px solid var(--line-3);border-radius:10px;background:#0f172a;padding:3px 6px;color:#e2e8f0}
.link-post{font-size:11.5px;color:var(--cyan);font-weight:600}
/* calendar */
.calw{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#334155 transparent}
.cal{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px;min-width:760px}
.cal .dh{text-align:center;font-size:12px;color:var(--muted);font-weight:500;padding-bottom:2px}
.cal .d{min-height:128px;border:1px solid var(--line-3);border-radius:16px;background:rgba(15,23,42,.9);padding:8px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.cal .d:hover{border-color:#475569}
.cal .d.out{background:rgba(2,6,23,.8);opacity:.6}
.cal .d .dn{font-size:13px;font-weight:600;color:#f1f5f9;padding:0 6px;align-self:flex-start;border-radius:99px}
.cal .d.today{border-color:#67e8f9;box-shadow:0 0 0 2px rgba(103,232,249,.5)}
.cal .d.today .dn{background:#67e8f9;color:#020617}
.ev{font-size:10.5px;line-height:1.25;border-radius:8px;overflow:hidden;border:1px solid color-mix(in srgb,var(--s) 45%,transparent);background:color-mix(in srgb,var(--s) 12%,#0f172a)}
.ev::before{content:"";display:block;height:3px;background:var(--c)}
.ev span{display:block;padding:3px 6px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.job{border-style:dashed;background:transparent}
.ev.sep{background:transparent!important;border:2px solid var(--c)!important}
.cmnews{display:grid;gap:12px}
.card.tapstage{cursor:pointer}.card.tapstage:hover{border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
.ev.sep::before{display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:18px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}
/* redes */
.charts svg{width:100%;height:auto;display:block}
.axis{fill:#64748b;font-size:10px;font-family:var(--sans)}
.gridl{stroke:#1e293b;stroke-width:1;stroke-dasharray:3 3}
.chartbox{border:1px solid rgba(30,41,59,.7);background:linear-gradient(to bottom,rgba(2,6,23,.6),rgba(15,23,42,.3));border-radius:16px;padding:10px}
.line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative;animation:pop .6s ease}
.donut::after{content:"";position:absolute;inset:24px;background:#0f172a;border-radius:50%}
@keyframes pop{from{transform:scale(.85);opacity:.3}}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:10px;font-size:13px;color:#cbd5e1}
.bar .tr{height:10px;background:#1e293b;border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(to right,#2563eb,#22d3ee);border-radius:99px;transform-origin:left;animation:grow .8s ease both;animation-delay:var(--dl,0ms)}
@keyframes grow{from{transform:scaleX(0)}}
.bar .v{text-align:right;font-size:12.5px;font-weight:600;color:#fff}
.tag{display:inline-block;border:1px solid var(--line-3);background:rgba(2,6,23,.6);border-radius:8px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.brandbox{border:1px solid var(--line-2);background:var(--inner-2);border-radius:16px;padding:16px}
/* permisos */
.perm td,.perm th{text-align:center;padding:10px 6px}
.perm td:first-child,.perm th:first-child{text-align:left;padding-left:18px;position:sticky;left:0;background:#0f172a;z-index:1}
.perm th{font-size:10px;letter-spacing:.06em;white-space:normal;min-width:78px;line-height:1.25}
.tog{width:44px;height:24px;border-radius:99px;border:0;background:#334155;position:relative;padding:0;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog[aria-pressed="true"]{background:#06b6d4}
.tog[aria-pressed="true"]::after{left:22px}
.tog:disabled{opacity:.5;cursor:not-allowed}
.who{display:flex;flex-direction:column;min-width:150px}
.who b{font-weight:600;color:#fff}
.who span{font-size:12px;color:var(--faint)}
.bchip{border:1px solid var(--line-3);background:var(--inner);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--faint);transition:all .15s}
.bchip.on{border-color:var(--c);color:#fff;background:color-mix(in srgb,var(--c) 25%,transparent)}
/* tv */
.tv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px}
.tv .col-h{font-size:18px;--c:#06b6d4}
.note{font-size:13px;color:var(--faint)}
.matform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.matform label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.matform label.wide{grid-column:span 2}
.matform input.base{border:1px solid var(--line-3);background:var(--inner);border-radius:16px;padding:8px 12px;color:#f1f5f9;outline:none;color-scheme:dark}
.matform input.base:focus{border-color:var(--cyan)}
@media (max-width:640px){.matform label.wide{grid-column:auto}}
/* redes */
.ftable td{padding:7px 14px;font-weight:400}
.ftable .brand{font-weight:400}
.ftable .dbadge{font-weight:500}
.ftable td.past,.ftable th.past{color:#475569}
.ftable .arow .dbadge{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0ms) + 250ms)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.noanim .ftable .dbadge{animation:none!important}
.ftable td.cur{color:#fcd34d;font-weight:700}
.ftable th.cur{color:#fcd34d}
.ftable tr.total td{font-weight:800;color:#fff;border-top:1px solid var(--line-3);background:rgba(30,41,59,.35)}
.dbadge{display:inline-block;border-radius:8px;border:1px solid;padding:1px 8px;font-size:12px;font-weight:700}
.dbadge.up{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.15);color:#6ee7b7!important}
.dbadge.down{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.15);color:#fca5a5!important}
.dbadge.eq{border-color:rgba(71,85,105,.5);background:rgba(51,65,85,.4);color:#94a3b8}
.fbars{display:flex;flex-direction:column;gap:8px;border:1px solid rgba(30,41,59,.7);background:linear-gradient(to bottom,rgba(2,6,23,.6),rgba(15,23,42,.3));border-radius:16px;padding:12px}
.fbar{display:flex;align-items:center;gap:8px}
.fbar .lb{width:130px;flex:none;font-size:12px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .tr{flex:1;height:20px;border-radius:5px;background:rgba(30,41,59,.5);overflow:hidden}
.fbar .fl{height:100%;border-radius:5px;transform-origin:left;animation:grow .9s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--dl,0ms)}
.fbar .v{width:64px;text-align:right;font-size:12px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums}
.thumb{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#0f172a),#0f172a);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.rank{font-weight:800;color:var(--cyan);width:22px;text-align:center}
.pubsel{display:flex;gap:8px;flex-wrap:wrap}
.agetxt{fill:#94a3b8;font-size:15px;font-family:var(--sans)}
.agetxt.agex{fill:#e2e8f0;font-size:19px;font-weight:700}
/* vista TV (pensadas para una tele 16:9: ocupan toda la altura) */
.tvpage{display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 48px);padding:4vh 4vw}
.tvhead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.tvclock{font-size:34px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.tvclock small{display:block;font-size:12px;font-weight:500;color:var(--faint);margin-top:4px;text-align:right}
.tvsum{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
.tvsum .panel{padding:16px 18px}
.tvteam{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:14px;min-height:0}
@media (max-width:1100px){.tvteam{grid-template-columns:repeat(2,minmax(0,1fr))}.tvsum{grid-template-columns:1fr}}
.tvp{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:220px;overflow:hidden}
.tvp .top{display:flex;align-items:center;gap:10px}
.tvp .top b{color:#fff;font-size:17px;display:block}
.tvp .top span{color:var(--faint);font-size:12.5px}
.tvp .jl{display:flex;flex-direction:column;gap:6px;flex:1}
.tvp .jr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:var(--inner-2);border:1px solid var(--line-2);font-size:13px;color:#e2e8f0}
.tvp .jr b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* vista TV redes */
.tvbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.tvtimer{height:4px;border-radius:99px;background:#1e293b;overflow:hidden;margin-bottom:14px}

.prog{display:flex;flex-direction:column;gap:6px}
.prog .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.prog .ph b{color:#fff;font-size:15px}
.prog .ph span{color:var(--muted);font-size:12.5px}

.ptrack{height:16px;border-radius:99px;background:#1e293b;overflow:hidden;position:relative}

.pfill{height:100%;border-radius:99px;background:linear-gradient(to right,#2563eb,#22d3ee);box-shadow:0 0 14px rgba(34,211,238,.35);transform-origin:left;animation:grow 1.2s cubic-bezier(.22,1,.36,1) both;animation-duration:1.2s,1.2s;animation-fill-mode:both,both}
.pfill.lv-red{background:#ef4444;box-shadow:0 0 14px rgba(239,68,68,.45);animation-name:grow,c-red}
.pfill.lv-orange{background:#f97316;box-shadow:0 0 14px rgba(249,115,22,.45);animation-name:grow,c-orange}
.pfill.lv-yellow{background:#eab308;box-shadow:0 0 14px rgba(234,179,8,.45);animation-name:grow,c-yellow}
.pfill.lv-green{background:linear-gradient(to right,#059669,#34d399);box-shadow:0 0 14px rgba(52,211,153,.45);animation-name:grow,c-green}
@keyframes c-red{from{background:#ef4444}}
@keyframes c-orange{0%{background:#ef4444}100%{background:#f97316}}
@keyframes c-yellow{0%{background:#ef4444}50%{background:#f97316}100%{background:#eab308}}
@keyframes c-green{0%{background:#ef4444}35%{background:#f97316}70%{background:#eab308}100%{background:#10b981}}
.seg{animation:segdraw 1s cubic-bezier(.22,1,.36,1) both}
@keyframes segdraw{from{stroke-dasharray:0 var(--C)}}
.arow{animation:slideup .45s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--i,0ms)}
@keyframes slideup{from{opacity:0;transform:translateY(10px)}}
.arow .sev{animation:sevglow 2.4s ease-in-out infinite}
@keyframes sevglow{50%{box-shadow:0 0 2px var(--c)}}
/* Las animaciones de entrada corren solo al abrir una pantalla, no en cada clic dentro de ella. */
.noanim .fl,.noanim .pfill,.noanim .agebar,.noanim .seg,.noanim .arow,.noanim .line{animation:none!important}

.noanim.fade{animation:none}
.pmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint)}

/* dashboard */

.cmp{font-size:12px;margin-top:4px}
/* toast */
.toast{position:fixed;right:20px;bottom:20px;z-index:50;border:1px solid rgba(16,185,129,.6);background:rgba(15,23,42,.95);backdrop-filter:blur(4px);color:#d1fae5;padding:12px 20px;border-radius:16px;font-size:14px;font-weight:500;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);max-width:calc(100% - 40px);animation:slide .25s ease}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
/* Calendarios: tocar un contenido lo abre; tocar un día carga uno nuevo */
.cal [data-open]{cursor:pointer}
.cal [data-open]:hover{filter:brightness(1.25)}
.calw.addable .d:not(.out){cursor:pointer}
.calw.addable .d:not(.out):hover{border-color:color-mix(in srgb,var(--cyan) 60%,transparent)}
.cmrec .cmplus{font-size:20px}
/* Cambiar de etapa desde el calendario */
.ev .stbtn{all:unset;display:block;box-sizing:border-box;width:100%;padding:0 6px 3px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev .stbtn:hover,.ev .stbtn:focus-visible{text-decoration:underline}
#stagepop{position:fixed;z-index:80;min-width:220px;max-width:280px;background:linear-gradient(var(--panel),var(--panel)),var(--bg);border:1px solid var(--line-3);border-radius:14px;padding:8px;box-shadow:0 20px 40px -10px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:3px}
#stagepop .sp-h{font-size:12px;color:var(--muted);padding:4px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stagepop .sp-n{font-size:11.5px;color:var(--faint);padding:6px 8px 2px}
#stagepop button{all:unset;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
#stagepop button i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
#stagepop button:hover,#stagepop button:focus-visible{background:rgba(51,65,85,.55)}
#stagepop button.on{background:color-mix(in srgb,var(--c) 18%,transparent);color:#fff}
/* Staff: tu tarjeta abre Mi perfil; Admin total elige quién aparece */
.scard{position:relative}
.scard.mine{cursor:pointer;border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
.scard.mine:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--cyan) 35%,transparent)}
.scard .myedit{margin:10px 0 0;font-size:12.5px;color:var(--cyan)}
.scard.shidden{opacity:.5}
.scard .svisrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)}
/* Planificación del mes: íconos lineales de un solo color */
.pmico{display:inline-grid;place-items:center;color:var(--cyan)}
.pmico svg,.pmico i{width:20px;height:20px;stroke-width:1.75}
.pmh{display:flex;align-items:center;gap:10px}
.pmtab .pmi .pmico svg{width:26px;height:26px}
.pmtab.on .pmi .pmico{color:#fff}
.oglabel .pmico,.oarea .pmico{color:var(--muted)}.oglabel .pmico svg,.oarea .pmico svg{width:16px;height:16px}
.oglabel{display:flex;align-items:center;gap:8px}
.pmfoot{display:inline-flex;align-items:center;gap:6px}.pmfoot svg{width:14px;height:14px}
/* Objetivos por área: sobrios, sin tantos colores */
.ogrid .ogroup{border-top:1px solid var(--line-3)!important}
.ogrid .oglabel{color:var(--muted)!important;letter-spacing:.06em}
.oitem .onum{background:transparent!important;color:var(--cyan)!important;border:1.5px solid color-mix(in srgb,var(--cyan) 55%,transparent);font-weight:800}
/* Objetivos principales */
.prios{border-color:color-mix(in srgb,var(--cyan) 40%,transparent);background:linear-gradient(135deg,rgba(6,182,212,.10),rgba(37,99,235,.08)),var(--panel)}
.prios{padding:26px 28px}
.prios h2{font-size:26px}.prios .pmh .pmico svg{width:26px;height:26px}
.priolist{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.priolist li{padding:18px;border-radius:18px;background:rgba(2,6,23,.35);border:1px solid var(--line-2)}
.priolist li,.prioedit{display:flex;gap:12px;align-items:flex-start}
.priolist p{margin:0;color:var(--ink);font-weight:700;font-size:19px;line-height:1.4}
.prioedit{margin-top:8px}.prioedit textarea{flex:1;resize:vertical}
.pnum{flex:none;width:40px;height:40px;font-size:19px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(to bottom right,#22d3ee,#2563eb)}
/* Nombres de las personas: degradado celeste → azul */
.gname{background:linear-gradient(90deg,#67e8f9,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
html.light .gname{background-image:linear-gradient(90deg,#0891b2,#2563eb)}
#whoami[data-sync]:not([data-sync=""])::after{content:" · " attr(data-sync);color:var(--faint)}
/* login */
.login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:#020617;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(6,182,212,.12) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(59,130,246,.08) 0%,transparent 60%)}
.login .panel{width:100%;max-width:420px;padding:32px}
.login-top{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;margin-bottom:28px}
.login-mark{width:64px;height:64px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(to bottom right,#22d3ee,#2563eb);box-shadow:0 10px 15px -3px rgba(6,182,212,.3),0 0 0 4px rgba(6,182,212,.1)}
.login-mark img{width:128px;height:128px;display:block;filter:drop-shadow(0 12px 24px rgba(37,99,235,.35))}
.login-mark{background:none!important;box-shadow:none!important;width:128px!important;height:128px!important;border-radius:0!important}
.login h1{font-size:24px}
.login .sub{color:var(--muted)}
.login-form{display:flex;flex-direction:column;gap:12px}
.login input{border:1px solid var(--line-3);background:var(--inner);border-radius:16px;padding:9px 12px;outline:none;transition:border-color .15s}
.login input:focus{border-color:var(--cyan)}
.login .enter{border:0;border-radius:16px;padding:12px;font-weight:600;color:#fff;background:linear-gradient(to right,#06b6d4,#3b82f6);box-shadow:0 10px 15px -3px rgba(6,182,212,.2);transition:all .15s}
.login .enter:hover{background:linear-gradient(to right,#22d3ee,#60a5fa)}
.login .enter:active{transform:scale(.98)}
.login .remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.login .remember input{width:16px;height:16px;accent-color:#06b6d4}
.login .hint{font-size:12px;color:var(--faint);text-align:center}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@media (max-width:767px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line-2);padding:14px 16px;gap:12px}
  .nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .nav-group{display:contents}
  .nav-label{display:none}
  .side-foot{flex-direction:row;flex-wrap:wrap;align-items:center}
  .side-foot select{width:auto;flex:1}
  .content{padding:16px}
  .pipe{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bar{grid-template-columns:100px 1fr 40px}
}

/* v28 · demográfico en 3 columnas parejas */
.demo-grid{display:grid;grid-template-columns:1.15fr 1.45fr 1fr;grid-template-areas:"cities ages sex";gap:14px;align-items:stretch}
.demo-grid .dcard{display:flex;flex-direction:column}
.d-cities .cl{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.cityrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.d-ages .ab{flex:1;display:flex;align-items:center}
.d-sex .sx{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.sexdonut{width:min(210px,80%);margin:0 auto;display:block;height:auto}
.sexdonut .c1{font-size:34px;font-weight:800;fill:#fff;font-family:var(--sans)}
.sexdonut .c2{font-size:13px;fill:#cbd5e1;font-family:var(--sans);letter-spacing:.06em;text-transform:uppercase}
.sexlist{display:flex;flex-direction:column;gap:10px}
.sexlist .sr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px;font-size:14px;color:#e2e8f0}
.sexlist .sr i{width:12px;height:12px;border-radius:4px;display:block}
.sexlist .sr b{font-variant-numeric:tabular-nums;color:#fff}
.sexlist .sr .tb{grid-column:1/-1;height:6px;border-radius:99px;background:rgba(30,41,59,.7);overflow:hidden}
.sexlist .sr .tb span{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .9s cubic-bezier(.22,1,.36,1) both}
@media (max-width:1250px){.demo-grid{grid-template-columns:1fr 1fr;grid-template-areas:"ages ages" "cities sex"}}
@media (max-width:760px){.demo-grid{grid-template-columns:1fr;grid-template-areas:"ages" "cities" "sex"}}
.tvredes .demo-grid{grid-template-columns:1.15fr 1.5fr 1fr;grid-template-areas:"cities ages sex"}
.tvredes .dcard{justify-content:flex-start}
.tvredes .cityrow{font-size:clamp(14px,1.9vh,20px);padding:clamp(3px,.7vh,8px) 0}
.tvredes .agesvg{max-height:none}
.tvredes .sexdonut{width:min(260px,85%)}
.tvredes .sexlist .sr{font-size:clamp(15px,2vh,20px)}
.tvredes .sexlist .sr .tb{height:8px}
/* v28 · tabla TV que entra en la pantalla */
.tvredes .ftable td{padding:clamp(6px,1.35vh,20px) 18px!important;font-size:clamp(15px,2vh,21px)}
.tvredes .ftable .brand{font-size:clamp(17px,2.4vh,25px)}
.tvredes .ftable th{padding-top:clamp(6px,1.2vh,14px)!important;padding-bottom:clamp(6px,1.2vh,14px)!important}
.tvredes .ftable .dbadge{font-size:clamp(13px,1.7vh,17px)}
.tvredes .panel.flush .panel-h{padding:clamp(10px,2vh,22px) 40px}
.tvredes .panel.flush .panel-h .tag-row{display:none}
.tvredes .panel.flush .panel-h h2{margin:0}
/* v28 · arrastrar y soltar */
[draggable="true"]{cursor:grab}
[draggable="true"]:active{cursor:grabbing}
.dragging{opacity:.35}
.kanban .col.over,.cal .d.over{outline:2px dashed #22d3ee;outline-offset:-2px;background:rgba(8,51,68,.45)}
.cal .d.nodrop{opacity:.35}
.monthbar .btn.dragnav{box-shadow:0 0 0 2px #22d3ee;background:rgba(8,51,68,.6)}
.draghint{font-size:12.5px;color:var(--faint)}

/* v28b · edades horizontales + TV que entra en pantalla */
.demo-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,1fr)}
.agebars{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:8px;width:100%}
.agebars .ar{display:grid;grid-template-columns:58px 1fr 46px;align-items:center;gap:10px}
.agebars .al{font-size:15px;font-weight:700;color:#e2e8f0;font-variant-numeric:tabular-nums}
.agebars .tr{height:22px;border-radius:7px;background:rgba(30,41,59,.55);overflow:hidden}
.agebars .fl{height:100%;border-radius:7px;background:linear-gradient(to right,#2563eb,#22d3ee);transform-origin:left;animation:grow .9s cubic-bezier(.22,1,.36,1) both}
.agebars b{font-size:16px;color:#fff;text-align:right;font-variant-numeric:tabular-nums}
.d-ages .ab{align-items:stretch}
@media (max-width:1250px){.demo-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:760px){.demo-grid{grid-template-columns:minmax(0,1fr)}}
.tvredes .demo-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1.2fr) minmax(0,1fr);flex:1;min-height:0}
.tvredes .demo-wrap{padding:clamp(10px,1.6vh,20px)}
.tvredes .dcard{padding:clamp(10px,1.6vh,18px) clamp(14px,1.4vw,22px)}
.tvredes .dcard h3{font-size:clamp(16px,2.4vh,24px);margin-bottom:clamp(6px,1.2vh,14px)!important}
.tvredes .agebars .al{font-size:clamp(14px,2.1vh,22px);width:auto}
.tvredes .agebars .ar{grid-template-columns:clamp(54px,5vw,84px) 1fr clamp(44px,4vw,64px)}
.tvredes .agebars .tr{height:clamp(16px,3.2vh,34px)}
.tvredes .agebars b{font-size:clamp(15px,2.3vh,24px)}
.tvredes .sexdonut{width:min(clamp(120px,24vh,260px),85%)}
.tvredes .d-sex .sx{gap:clamp(8px,1.6vh,18px)}
.tvredes .tvhero{padding:clamp(8px,1.4vh,16px) 26px;margin-bottom:clamp(8px,1.2vh,14px);flex-wrap:nowrap}
.tvredes .tvhero .nm b{font-size:clamp(34px,6vh,64px)}
.tvredes .tvhero .nm span{font-size:clamp(11px,1.5vh,16px);margin-top:4px}
.tvredes .tvhero .ig{font-size:clamp(24px,4.4vh,46px);white-space:nowrap}
.tvredes .tvhero .fb{font-size:clamp(15px,2.4vh,26px);white-space:nowrap;margin-top:2px}
.tvredes .tvhero .ig small,.tvredes .tvhero .fb small{font-size:clamp(12px,1.5vh,16px)}
/* barra flotante para pasar de mes mientras se arrastra */
#dragMonths{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;display:flex;gap:10px;animation:tvin .25s ease both}
#dragMonths .dmb{padding:12px 20px;border-radius:16px;border:2px dashed #22d3ee;background:rgba(2,6,23,.92);color:#a5f3fc;font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#dragMonths .dmb.dragnav{background:rgba(8,51,68,.95);color:#fff;border-style:solid}

/* v28c · la Vista TV Redes ocupa justo el alto de la pantalla, sin scroll */
.tvredes{height:calc(100vh - 48px);min-height:0;padding:3vh 4vw;gap:1vh}
.tvredes:fullscreen{height:100vh;padding:5vh 5vw}
.tvredes .tvstage,.tvredes .tvslide,.tvredes .tvslide > .panel,.tvredes .tvslide > .demo-wrap,.tvredes .demo-grid,.tvredes .dcard,.tvredes .grid.two,.tvredes .grid.two > div,.tvredes .fcard{min-height:0}
.tvredes .dcard{overflow:hidden}
.tvredes .tvtitle{margin:.4vh 0 1vh}
@media (max-height:900px){.tvredes .tvbar .sub{display:none}}
.tvredes .cityrow{padding:0;flex:1;align-items:center;max-height:52px}
.tvredes .d-cities .cl{justify-content:space-evenly}
.tvredes .fbar .tr{height:clamp(16px,3.4vh,44px)}
.tvredes .fbar .lb,.tvredes .fbar .v{font-size:clamp(14px,2vh,19px)}
.tvredes .fcard{gap:clamp(6px,1.2vh,14px);padding:clamp(10px,1.6vh,18px)}
.tvredes .panel{padding:clamp(14px,2.4vh,28px) 36px}
.tvredes .panel > h2{font-size:clamp(22px,3.4vh,32px)!important}
.tvredes .panel > .sub{margin:2px 0 1.4vh!important}

.tvredes .panel.flush .tw{flex:1;min-height:0;overflow:hidden}
.tvredes .panel.flush .ftable{height:100%;width:100%}
.tvredes .ftable td,.tvredes .ftable th{padding-left:clamp(6px,.9vw,18px)!important;padding-right:clamp(6px,.9vw,18px)!important}
.tvredes .ftable td:first-child,.tvredes .ftable th:first-child{padding-left:clamp(14px,2.2vw,40px)!important}
.tvredes .ftable td:last-child,.tvredes .ftable th:last-child{padding-right:clamp(14px,2.2vw,40px)!important}
.tvredes .ftable td{white-space:nowrap}

.tvredes .ftable .brand{font-size:clamp(16px,min(2.4vh,1.5vw),25px)}
.tvredes .ftable td{font-size:clamp(14px,min(2vh,1.35vw),21px)}
.tvredes .ftable th{font-size:clamp(11px,.95vw,14px);letter-spacing:.1em}

/* v29 · Vista TV Team: 5 diseñadores + 4 CM en una pantalla */
.tvpage{gap:clamp(14px,1.8vh,24px)}
.tvsum{gap:clamp(16px,1.4vw,28px)}
.tvsum .panel{padding:clamp(12px,1.6vh,20px) 24px}
.tvrow{display:flex;flex-direction:column;gap:clamp(8px,1vh,12px);flex:1;min-height:0}
.tvrow-h{display:flex;align-items:baseline;gap:14px;padding-left:4px}
.tvrow-h b{font-size:clamp(15px,2vh,20px);letter-spacing:.14em;text-transform:uppercase;color:#67e8f9}
.tvrow-h span{font-size:clamp(13px,1.6vh,16px);color:var(--faint)}
.tvgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(16px,1.4vw,28px)}
.tvgrid .tvp{min-height:0;padding:clamp(14px,1.8vh,22px) clamp(14px,1.1vw,22px);gap:clamp(8px,1.1vh,12px);border-radius:22px;border:1px solid var(--line-3);box-shadow:0 18px 30px -12px rgba(0,0,0,.5)}
.tvgrid .tvp .top{display:flex;align-items:center;gap:12px}
.tvgrid .tvp .avatar{width:clamp(40px,5vh,56px);height:clamp(40px,5vh,56px);border-radius:16px;font-size:clamp(14px,1.8vh,19px);flex:none}
.tvgrid .tvp .who{min-width:0;flex:1}
.tvgrid .tvp .who b{display:block;color:#fff;font-size:clamp(17px,2.3vh,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvgrid .tvp .who span{display:block;color:var(--muted);font-size:clamp(12px,1.5vh,15px)}
.tvgrid .tvp .pct{font-size:clamp(26px,3.8vh,42px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.tvgrid .tvp .pct span{font-size:inherit;color:inherit}
.tvgrid .tvp .ptrack{height:clamp(10px,1.4vh,16px)}
.tvgrid .tvp .cnt{display:flex;gap:12px;flex-wrap:wrap;font-size:clamp(12px,1.6vh,16px);color:var(--muted)}
.tvgrid .tvp .cnt i{font-style:normal;font-weight:800;color:#fff;font-size:1.2em}
.tvgrid .tvp .jl{display:flex;flex-direction:column;gap:clamp(5px,.8vh,8px);flex:1;min-height:0;overflow:hidden}
.tvgrid .tvp .jr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:clamp(6px,.9vh,10px) 10px;border-radius:12px;background:var(--inner-2);border:1px solid var(--line-2);border-left:4px solid var(--b);font-size:clamp(13px,1.7vh,17px)}
.tvgrid .tvp .jr b{font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tvgrid .tvp .ub{flex:none;font-size:clamp(11px,1.4vh,14px);font-weight:800;padding:2px 8px;border-radius:99px;color:var(--u);border:1px solid color-mix(in srgb,var(--u) 55%,transparent);background:color-mix(in srgb,var(--u) 16%,transparent);white-space:nowrap}
.tvgrid .tvp .ub.late{background:var(--u);color:#fff;animation:pulse 1.4s ease-in-out infinite}
.tvgrid .tvp .dd{flex:none;font-size:clamp(11px,1.4vh,14px);color:var(--faint);font-variant-numeric:tabular-nums}
.tvgrid .tvp .more{font-size:clamp(12px,1.4vh,14px);color:var(--faint)}
.tvgrid .tvp .empty{padding:8px;font-size:15px}
.tvpage:fullscreen{height:100vh;padding:4vh 4vw}
/* v29 · números más grandes en la TV de seguidores */
.tvredes .fbar .v{font-size:clamp(18px,min(3vh,1.7vw),32px)!important;font-weight:800;width:auto;min-width:clamp(90px,8vw,150px)}
.tvredes .fbar .lb{font-size:clamp(15px,min(2.3vh,1.3vw),23px)!important}
.tvredes .ftable td.num{font-size:clamp(15px,min(2.5vh,1.5vw),27px)}
.tvredes .ftable td.cur{font-size:clamp(17px,min(3vh,1.8vw),32px);font-weight:800}
.tvredes .ftable .dbadge{font-size:clamp(14px,min(2vh,1.25vw),20px)}

/* v29b · tarjetas del equipo más ordenadas */
.tvsum.one{grid-template-columns:1fr}
.tvsum.one .panel{padding:clamp(10px,1.4vh,18px) 26px}
.tvsum.one .pmeta{font-size:clamp(13px,1.7vh,17px)}
.tvrow-h{align-items:center}
.tvrow-h .rbar{flex:1;display:flex;align-items:center;gap:12px;max-width:520px;margin-left:auto}
.tvrow-h .rbar .ptrack{flex:1;height:12px}
.tvrow-h .rbar em{font-style:normal;font-weight:900;font-size:clamp(18px,2.4vh,26px);font-variant-numeric:tabular-nums}
.tvgrid .tvp .pline{display:flex;align-items:center;gap:12px}
.tvgrid .tvp .pline .ptrack{flex:1}
.tvgrid .tvp .pct{font-size:clamp(24px,3.4vh,38px)}

  const cities = S.cities.map(([c,v],i) => [c, v - 0.9 + seeded(b + c) * 0.8]);
  let last = cities[cities.length-1][1];
  for (const c of EXTRA_CITIES){ if (cities.length >= 10) break; if (cities.some(x => x[0] === c)) continue; last = last * (0.72 + seeded(b + c) * 0.2); cities.push([c, last]); }
  const unk = 4 + seeded(b + "u") * 4, fem = S.f * (100 - unk) / 100;
  const teen = 1 + seeded(b + "t") * 2, ages = [teen, ...S.ages.map(v => v * (100 - teen) / 100)];
  return { cities, fem, male: 100 - unk - fem, unk, ages, handle:"@" + b.toLowerCase().replace(/[^a-z0-9]/g,""), foll:S.ig[SOCIAL_IDX[MONTH]] };
}
function donut(parts, big, lbl){
  const R = 70, C = 2 * Math.PI * R; let off = 0;
  return `<svg class="sexdonut" viewBox="0 0 200 200" role="img" aria-label="Distribución por sexo">${parts.map(([v,c]) => { const len = v / 100 * C; const seg = `<circle class="seg" cx="100" cy="100" r="${R}" fill="none" stroke="${c}" stroke-width="26" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)" style="--C:${C.toFixed(1)}"/>`; off += len; return seg; }).join("")}${big ? `<text class="c1" x="100" y="104" text-anchor="middle">${big}</text><text class="c2" x="100" y="126" text-anchor="middle">${lbl}</text>` : ""}</svg>`;
}

}

// Teléfonos en formato local con el prefijo entre paréntesis: 0981111222 o +595 981 111 222 → (0981) 111 222.
function fmtPhone(v){
  const raw = String(v || "").trim(); let d = raw.replace(/\D/g, "");
  if (d.startsWith("595")) d = "0" + d.slice(3);
  if (!d.startsWith("0") || d.length < 7) return raw;
  const n = d.startsWith("021") ? 3 : 4, rest = d.slice(n);
  const groups = rest.length === 7 ? [rest.slice(0, 3), rest.slice(3)] : rest.match(/.{1,3}/g);
  return `(${d.slice(0, n)}) ${groups.join(" ")}`;
}

// Reordenar: arrastrando desde ⋮⋮ (mouse) o con las flechitas (táctil)
function moveInArr(arr, from, to){ if (from < 0 || to < 0 || to >= arr.length) return; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); }
function moveNote(kind, id, t){
  const list = myNotes();
  if (kind === "nitem"){ const [nid, iid] = id.split("|").map(Number), n = list.find(x => x.id === nid), tid = +t.dataset.nit.split("|")[1];
    const from = n.items.findIndex(x => x.id === iid), to = n.items.findIndex(x => x.id === tid); moveInArr(n.items, from, to); }
  else { const from = list.findIndex(x => x.id === +id), to = list.findIndex(x => x.id === +t.dataset.nsheet); moveInArr(list, from, to); }
  render();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-note-mv],[data-sheet-mv]"); if (!b) return; const list = myNotes();
  if (b.dataset.noteMv){ const [nid, iid, d] = b.dataset.noteMv.split("|").map(Number), n = list.find(x => x.id === nid), i = n.items.findIndex(x => x.id === iid); moveInArr(n.items, i, i + d); }
  else { const [nid, d] = b.dataset.sheetMv.split("|").map(Number), i = list.findIndex(x => x.id === nid); moveInArr(list, i, i + d); }
  render();
});

function pedirDiseno(postId){
  const p = postById(postId);
  p.status = "En diseño";
  const due = new Date(p.date+"T12:00"); due.setDate(due.getDate()-2);
  jobs.push({ id:nextJobId("Diseño"), area:"Diseño", title:`${p.format} ${p.title.toLowerCase()}`, brand:p.brand, piece:p.format, owner:"Sin asignar", due:due.toISOString().slice(0,10), status:"Pendiente", post:p.id, priority:"Media", complexity:"Media", requester:"Marketing", requestDate:TODAY, link:"", notes:"" });
  toast(`Pedido de diseño creado para “${p.title}”. Queda en Pedidos, sin asignar.`);
  render();
}
function advancePost(postId){
  const p = postById(postId);
  const next = { "Listo":"Programado", "Programado":"Publicado", "Publicado":"Pautado" }[p.status];
  if (!next) return;
  p.status = next; toast(`“${p.title}” pasó a ${next}.`); render();
}
function advanceJob(jobId){
  const j = jobs.find(x => x.id === jobId);
  const st = stagesOf(j), i = st.indexOf(j.status);
  if (i >= st.length-1) return;
  j.status = st[i+1];
  if (j.status === "Aprobado") j.approved = TODAY;
  if (isFin(j) && !j.delivered) j.delivered = TODAY;
  if (j.status === "Entregado" && j.post){
    const p = postById(j.post);
    if (p && p.status === "En diseño"){ p.status = "Listo"; toast(`Diseño entregado. El post “${p.title}” pasó a Listo para programar.`); render(); return; }
  }
  toast(`${j.title}: ${j.status}.`); render();
}

function alerts(){

    });
  }

    const u = urgency(j);
    if (u) out.push({ sev:u.c, rank: u.late ? 0 : daysTo(j.due) + 1, t:`${u.late ? "⏰ " : ""}${u.t}: ${j.title}`, m:`${j.brand} · ${j.owner} · entrega el ${dm(j.due)}` });

      .forEach(c => out.push({ sev:"var(--warn)", t:`Pauta por terminar: ${c.name}`, m:`${c.brand} · termina el ${dm(c.end)}` }));
  }
  if (can("cumples")) bdayAlerts().forEach(({ pp, d }) => out.push({ sev: d === 0 ? "#ef4444" : "#f97316", rank:-2, t:`🎂 ${d === 0 ? `Hoy cumple años ${pp.name}` : `${d === 1 ? "Mañana" : `En ${d} días`} cumple años ${pp.name}`}`, m:bdayLabel(pp.birthday) }));

// Progreso del mes: trabajos finalizados (Entregado) sobre el total del mes, sin contar cancelados.
function progStats(list){
  const l = list.filter(j => j.status !== "Cancelado" && jobMonth(j) === MONTH);
  const fin = l.filter(j => isFin(j)).length, pend = l.filter(j => j.status === "Pendiente").length;
  return { total:l.length, fin, pend, proc:l.length - fin - pend, pct: l.length ? Math.round(fin / l.length * 100) : 0 };
}
// Color del progreso: rojo (<25%) → naranja (<50%) → amarillo (<100%) → verde (100%). La animación recorre los colores hasta llegar al final.
const progLevel = (pct, done) => done ? "green" : pct >= 50 ? "yellow" : pct >= 25 ? "orange" : "red";
const PROG_COL = { red:"#ef4444", orange:"#f97316", yellow:"#eab308", green:"#10b981" };
function progBar(title, st, big = false, sub = ""){
  const done = st.total && st.fin === st.total;
  const lv = progLevel(st.pct, done);
  return `<div class="prog ${big ? "big" : ""}"><div class="ph"><div><b>${title}</b>${sub ? ` <span>${sub}</span>` : ""}</div><span class="pc" style="color:${PROG_COL[lv]}">${done ? "✓ " : ""}<span data-count="${st.pct}">${st.pct}</span>%</span></div>
    <div class="ptrack" role="progressbar" aria-valuenow="${st.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(title)}"><div class="pfill lv-${lv}" style="width:${Math.max(st.pct, st.total ? 1 : 0)}%"></div></div>
    <div class="pmeta"><span><i>${st.fin}</i> finalizadas</span><span><i>${st.proc}</i> en proceso</span><span><i>${st.pend}</i> pendientes</span><span>de <i>${st.total}</i> en ${monthName(MONTH)}</span>${done ? `<span style="color:#34d399;font-weight:700">¡Mes completo!</span>` : ""}</div></div>`;
}

    <div class="panel kpi"><div class="l">Total del mes</div><div class="n">${st.total}</div><div class="d">${st.pct}% completado</div></div>
  </div>`;
}

function objSpark(o){
  const W = 180, H = 56, P = 6, vals = [...o.hist, o.target], lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1;
  const x = i => P + i * (W - 2 * P) / Math.max(1, o.hist.length - 1), y = v => H - P - (v - lo) / sp * (H - 2 * P);
  const pts = o.hist.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "), last = o.hist.length - 1, c = OBJ_AREAS[o.area].c;
  return `<svg class="ospark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución semanal"><line x1="${P}" x2="${W - P}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="#34d399" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W - P}" y="${y(o.target) < 14 ? y(o.target) + 12 : y(o.target) - 4}" text-anchor="end" fill="#34d399" font-size="9" font-weight="700">meta</text><polyline class="line" points="${pts}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last)}" cy="${y(o.hist[last])}" r="3.6" fill="${c}"/></svg>`;
}

// Aparición animada de todo lo que se ve: paneles, tablas (fila por fila), calendarios (día por día), tableros, listas y tarjetas.
// Cada cosa se anima recién cuando entra en pantalla (también al bajar con el scroll), con un pequeño escalonado.
const REVEAL = [".panel", ".tw", ".tw tbody tr:not(.arow)", ".cal .dh", ".cal .d", ".cal .ev", ".kanban .col", ".kanban .card", ".list > .row", ".row", ".dcard", ".cityrow", ".agebars .ar", ".sexlist .sr", ".tvp", ".tvrow-h", ".monthbar", ".head", ".legend", ".urg-legend", ".pipe .stage", ".prow", ".fbar", ".grid > div", ".chips > .chip", "h1", ".sub", ".eyebrow", ".demo-h", ".bday", ".ro", ".scard", ".staff-grid > *", ".note-card", ".alist > *", ".items > *", ".rtabs", ".hellohead", ".motto", ".jfilters", ".pipe-note", ".tag-row", ".perm", ".fhead", ".demo-wrap", ".tvsum .panel", ".ocard", ".ccard", ".upitem", ".upmonth", ".svcard", ".svrq", ".svq", ".gcard"].join(",");
function reveal(){
  if (viewer.motion === "off") return;
  if (viewer.motion === "off" || !("IntersectionObserver" in window)) return;
  if ((page === "pedidos" && jobUI.view !== "calendario") || (page === "gestioncm" && cmUI.tview !== "calendario")){ // acá solo se animan las tarjetas (o las filas en la vista Tabla), todas juntas al entrar, columna por columna
    document.querySelectorAll("#content .kanban .col").forEach((col, ci) => col.querySelectorAll(".card").forEach((c, k) => { c.style.animationDelay = (ci * 110 + k * 80) + "ms"; c.classList.add("cardin"); }));
    document.querySelectorAll("#content .tw tbody tr").forEach((r, k) => { r.style.animationDelay = Math.min(k * 40, 700) + "ms"; r.classList.add("cardin"); });
    return; }
  const els = [...document.querySelectorAll("#content " + REVEAL.split(",").join(",#content "))].filter(el => !el.closest(".tvredes, .tvpage, .tvimp, .drawer, #dragMonths"));
  const idx = new Map();
  const io = new IntersectionObserver(ents => ents.forEach(en => { if (!en.isIntersecting) return; const el = en.target; io.unobserve(el);
    el.classList.add("in"); const done = e => { if (e.target !== el) return; el.classList.remove("rv","in"); el.removeEventListener("transitionend", done); }; el.addEventListener("transitionend", done);
    setTimeout(() => el.classList.remove("rv","in"), 1400); // por si no llega el transitionend
  }), { threshold:0.08, rootMargin:"0px 0px -4% 0px" });
  // Escalonado por grupo: cada grupo (días de un calendario, filas de una tabla…) tarda como mucho ~0,8 s en completarse.
  const size = new Map(); els.forEach(el => size.set(el.parentElement, (size.get(el.parentElement) || 0) + 1));
  els.forEach(el => { const par = el.parentElement, k = idx.get(par) || 0; idx.set(par, k + 1);
    el.style.setProperty("--rd", Math.round(k * Math.min(45, 800 / size.get(par))) + "ms"); el.classList.add("rv"); io.observe(el); });
}

  if (animate0(page)) { jobUI.owner = "Todos"; jobUI.q = ""; if (!stagesOf(jobArea()).includes(jobUI.status)) jobUI.status = jobUI.status === "Todos" ? "Todos" : "Activos"; }

  $("#content").innerHTML = `<div class="${animate ? (page === "pedidos" || page === "gestioncm" ? "anim" : "fade anim") : "noanim"}" style="display:flex;flex-direction:column;gap:24px">${bar}${["tv","tvredes","tvimpacto"].includes(page) ? "" : `<p class="eyebrow">${EYEBROW[page]}</p>`}${ro}${avb}${bdays}${PAGES[page]()}${demo}</div>`;

  // Las animaciones de lo que está más abajo arrancan recién cuando se ve en pantalla (al hacer scroll).
  if (animate && "IntersectionObserver" in window){
    // Se observa la tarjeta que contiene cada barra (una barra en escala 0 no tiene tamaño y nunca "se vería").
    const SEL = ".fl, .agebar, .seg, .pfill, .arow, .arow .dbadge";
    const io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting){ [en.target, ...en.target.querySelectorAll(SEL)].forEach(x => x.style.animationPlayState = "running"); io.unobserve(en.target); } }), { threshold:0.1 });
    const boxes = new Set();
    document.querySelectorAll("#content " + SEL.split(", ").join(", #content ")).forEach(el => {

  }
}

    else if (d.jnew !== undefined){ const area = jobArea(); jobUI.form = { mode:"new", job:{ id:nextJobId(area), area, requestDate:TODAY, requester:"Marketing", brand:myBrands()[0], piece:(area === "CM" ? CM_TYPES : DESIGN_TYPES)[0], title:"", owner:"Sin asignar", status:"Pendiente", priority:"Media", complexity:"Media", due:"", link:"", notes:"", post:null } }; }
    else if (d.jedit){ jobUI.form = { mode:"edit", job:{ ...find(d.jedit) } }; }
    else if (d.jdup){ const o = find(d.jdup); jobUI.form = { mode:"dup", job:{ ...o, id:nextJobId(o.area), requestDate:TODAY, status:"Pendiente", delivered:null, approved:null, post:null } }; }
    else if (d.jdel){ const o = find(d.jdel); jobs.splice(jobs.indexOf(o), 1); toast(`Trabajo ${o.id} borrado.`); }
    else if (d.jclose !== undefined) jobUI.form = null;
    render(); return; }
  if (e.target.closest("[data-bdclear]")){ viewer.birthday = null; render(); toast("Quitaste tu cumpleaños."); return; }
  const t = e.target.closest("[data-unew],[data-ugen],[data-ureset],[data-utoggle],[data-uconfirm],[data-ucancel],[data-uremove],[data-ucopy],[data-uclose]");
  if (!t) return;
  const d = t.dataset, find = id => PEOPLE.find(x => x.id === id);
  if (d.unew !== undefined){ userUI.newOpen = !userUI.newOpen; render(); }
  else if (d.ugen !== undefined){ $("#pPass").value = genPass(); }
  else if (d.ureset){ const pp = find(d.ureset); const pass = genPass();
    // Si la persona todavía no tenía cuenta, se la crea con esta contraseña provisoria.
    RMH.admin({ action:"set_password", person_id:pp.id, email:mainEmail(pp), role:pp.role, password:pass }).then(ok => { if (!ok) return;
      pp.mustChange = true; pp.tempPass = pass; resetRequests = resetRequests.filter(x => x !== pp.id); userUI.lastPass = { name:pp.name, pass }; render(); toast(`Contraseña de ${pp.name} restablecida. La anterior ya no funciona.`); }); }
  else if (d.utoggle){ const pp = find(d.utoggle);
    if (pp.active && pp.role === "Admin total" && activeAdmins().length <= 1){ toast("Tiene que quedar al menos un Admin total activo."); return; }
    RMH.admin({ action:"set_active", person_id:pp.id, active:!pp.active }).then(ok => { if (!ok) return;
      pp.active = !pp.active; refreshPeople(); render(); toast(pp.active ? `${pp.name} puede volver a entrar.` : `${pp.name} ya no puede entrar. Sus datos e historial se conservan.`); }); }
  else if (d.uconfirm){ userUI.confirm = d.uconfirm; render(); }
  else if (d.ucancel !== undefined){ userUI.confirm = null; render(); }
  else if (d.uremove){ const pp = find(d.uremove);
    if (pp.role === "Admin total" && pp.active && activeAdmins().length <= 1){ toast("No podés quitar al último Admin total activo."); userUI.confirm = null; render(); return; }
    RMH.admin({ action:"remove", person_id:pp.id }).then(ok => { if (!ok) return;
      let n = 0; jobs.forEach(j => { if (j.owner === pp.name && !isFin(j)){ j.owner = "Sin asignar"; n++; } });
      PEOPLE.splice(PEOPLE.indexOf(pp), 1); resetRequests = resetRequests.filter(x => x !== pp.id); userUI.confirm = null; refreshPeople(); render();
      toast(`${pp.name} fue quitado de la app.${n ? ` ${n} ${n === 1 ? "trabajo quedó" : "trabajos quedaron"} sin asignar.` : ""}`); }); }
  else if (d.ucopy){ navigator.clipboard?.writeText(d.ucopy).then(() => toast("Contraseña copiada."), () => toast("No se pudo copiar: seleccionala y copiala a mano.")); }
  else if (d.uclose !== undefined){ userUI.lastPass = null; render(); }
});
function setJobStatus(j, st){
  const prev = j.status; if (prev === st) return; j.status = st;
  if (j.status === "Aprobado" && !j.approved) j.approved = TODAY;
  const first = isFin(j) && !j.delivered;
  if (first) j.delivered = TODAY;
  if (j.status === "Entregado"){ const p = j.post && postById(j.post); if (p && p.status === "En diseño") p.status = "Listo"; }
  render(); toast(`${j.id}: ${prev} → ${j.status}${first ? ` (finalizado el ${dm(TODAY)}${TODAY > j.due ? ", con atraso" : ", a tiempo"})` : ""}.`);
}
document.addEventListener("change", e => {
  const js = e.target.closest("[data-jstatus]");

  const ps = e.target.closest("[data-pub]"); if (ps){ pubUI[ps.dataset.pub] = ps.value; render(); return; }
  const cf = e.target.closest("[data-cmf]"); if (cf){ cmUI[cf.dataset.cmf] = cf.value; render(); return; }
  const pcm = e.target.closest("[data-pcm]");
  if (pcm){ const p = postById(pcm.dataset.pcm); p.cm = pcm.value; render(); toast(`“${p.title}”: ahora lo hace ${firstName(p.cm)}.`); return; }
  const pst = e.target.closest("[data-pstatus]");
  if (pst){ const p = postById(pst.dataset.pstatus), to = pst.value;
    if (to === "En diseño" && !jobs.some(x => x.post === p.id)){ pedirDiseno(p.id); render(); toast(`“${p.title}” pasó a En diseño: se creó el pedido en Gestión Diseño.`); return; }
    p.status = to; render(); toast(`“${p.title}” pasó a ${to}.`); return; }
  const jf = e.target.closest("[data-jf]"); if (jf){ jobUI[jf.dataset.jf] = jf.value; render(); return; }

  if (e.target.id === "jArea" && jobUI.form){ const a = e.target.value; Object.assign(jobUI.form.job, { area:a, id:nextJobId(a), piece:(a === "CM" ? CM_TYPES : DESIGN_TYPES)[0], owner:"Sin asignar", title:$("#jTitle").value }); render(); return; }
  const s2 = e.target.closest("[data-urole]"); if (!s2) return;

    pp.role = nr; pp.perms = new Set(ROLE_DEFAULTS[nr]); if (nr === "Admin total" || nr === "Admin") pp.brands = null; refreshPeople(); render();
    toast(`${pp.name} ahora es ${nr}. Sus permisos pasaron a los de ese rol.`); });
});
document.addEventListener("click", e => {
  const tt = e.target.closest("[data-tt],[data-ttgo]");
  if (tt){ if (tt.dataset.ttgo){ tvTeamShow(+tt.dataset.ttgo); tvTeamLoop(); return; }
    const a = tt.dataset.tt;
    if (a === "next" || a === "prev"){ tvTeamShow(tvTeam.i + (a === "next" ? 1 : -1)); tvTeamLoop(); }
    else if (a === "pause"){ tvTeam.paused = !tvTeam.paused; tt.textContent = tvTeam.paused ? "▶ Seguir" : "⏸ Pausar"; const bar = document.getElementById("ttBar"); if (bar) bar.style.animationPlayState = tvTeam.paused ? "paused" : "running"; if (!tvTeam.paused){ tvTeamShow(tvTeam.i); tvTeamLoop(); } }
    return; }
  const t = e.target.closest("[data-tv],[data-tvgo],[data-tvteam]"); if (!t) return;
  if (t.dataset.tvteam){ const el = document.querySelector(".tvpage"); if (el && el.requestFullscreen) el.requestFullscreen().catch(() => toast("Tu navegador no permitió la pantalla completa.")); return; }
  if (t.dataset.tvgo){ tvShow(+t.dataset.tvgo); tvStart(); return; }
  const a = t.dataset.tv;
  if (a === "next"){ tvShow(tv.i + 1); tvStart(); }
  else if (a === "prev"){ tvShow(tv.i - 1); tvStart(); }
  else if (a === "pause"){ tv.paused = !tv.paused; t.textContent = tv.paused ? "▶ Seguir" : "⏸ Pausar"; const bar = document.querySelector(".tvtimer i"); if (bar) bar.style.animationPlayState = tv.paused ? "paused" : "running"; if (!tv.paused){ tvShow(tv.i); tvStart(); } }
  else if (a === "full"){ const st = document.getElementById("tvStage"); if (st && st.requestFullscreen) st.requestFullscreen().catch(() => toast("Tu navegador no permitió la pantalla completa.")); else toast("Tu navegador no permite pantalla completa acá."); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-dbrand]"); if (!t) return;
  dashBrand = t.dataset.dbrand;
  document.querySelectorAll("[data-dbrand]").forEach(c => c.classList.toggle("on", c.dataset.dbrand === dashBrand));
  const box = document.getElementById("dashDemo"); if (box){ box.innerHTML = demoBlock(dashBrand, Date.now() % 1000); box.classList.remove("swap"); void box.offsetWidth; box.classList.add("swap"); }
});
document.addEventListener("input", e => {
  const t = e.target, n = id => myNotes().find(x => String(x.id) === String(id));
  if (t.dataset.noteTitle) n(t.dataset.noteTitle).title = t.value;
  else if (t.dataset.noteText) n(t.dataset.noteText).text = t.value;
  else if (t.dataset.noteItext){ const [ni, ii] = t.dataset.noteItext.split("|"); const it = n(ni).items.find(x => String(x.id) === ii); if (it) it.text = t.value; }
});
document.addEventListener("keydown", e => {
  const t = e.target; if (e.key !== "Enter" || !t.dataset || !t.dataset.noteItem) return;
  const txt = t.value.trim(); if (!txt) return;
  const nid = t.dataset.noteItem; myNotes().find(x => String(x.id) === nid).items.push({ id:Date.now(), text:txt, done:false });
  render(); const again = document.querySelector(`[data-note-item="${nid}"]`); if (again) again.focus();
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-note-add],[data-note-del],[data-note-itemdel],[data-photo-del]"); if (!t) return;
  const d = t.dataset, list = myNotes();
  if (d.noteAdd){ const id = Date.now(); list.unshift(d.noteAdd === "note" ? { id, type:"note", title:"", text:"" } : d.noteAdd === "meeting" ? { id, type:"checklist", title:`Reunión del ${dm(TODAY)}`, items:[{ id:id + 1, text:"Temas a tratar", done:false }, { id:id + 2, text:"Acuerdos", done:false }, { id:id + 3, text:"Próximos pasos y responsables", done:false }] } : { id, type:"checklist", title:"", items:[] }); }
  else if (d.noteDel){ list.splice(list.findIndex(x => String(x.id) === d.noteDel), 1); toast("Hoja borrada."); }
  else if (d.noteItemdel){ const [ni, ii] = d.noteItemdel.split("|"); const note = list.find(x => String(x.id) === ni); note.items = note.items.filter(x => String(x.id) !== ii); }
  else if (d.photoDel !== undefined){ delete viewer.photo; toast("Quitaste tu foto."); }

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.noteCheck){ const [ni, ii] = t.dataset.noteCheck.split("|"); const it = myNotes().find(x => String(x.id) === ni).items.find(x => String(x.id) === ii); it.done = t.checked; render(); return; }
  if (t.id === "photoIn" && t.files && t.files[0]){
    const f = t.files[0]; if (!/^image\/(png|jpeg|webp)$/.test(f.type)){ toast("Elegí una imagen JPG, PNG o WebP."); return; }
    const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = 160; const sz = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - sz) / 2, (img.height - sz) / 2, sz, sz, 0, 0, 160, 160);
      viewer.photo = c.toDataURL("image/jpeg", 0.85); render(); toast("¡Foto actualizada! Ya se ve en Staff, Usuarios y tu Inicio."); };
      img.onerror = () => toast("No se pudo leer esa imagen."); img.src = r.result; }; r.readAsDataURL(f);
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "meForm"){ e.preventDefault();
    const m2 = $("#meMail2").value.trim(); if (m2 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m2)){ toast("Revisá el email personal: falta algo (ej.: nombre@gmail.com)."); return; }
    viewer.nick = $("#meNick").value.trim() || null; viewer.secondBrands = [...document.querySelectorAll('input[name="meSecond"]:checked')].map(x => x.value);
    viewer.quote = $("#meQuote").value.trim() || null; viewer.personalEmail = m2 || null; viewer.brandsHandled = [...document.querySelectorAll('input[name="meHandled"]:checked')].map(x => x.value);
    viewer.phone = $("#mePhone").value.trim(); viewer.mainBrand = $("#meBrand").value || null; if (viewer.mainBrand !== VARIAS) viewer.brandsHandled = []; viewer.skills = $("#meSkills").value.split(",").map(x => x.trim()).filter(Boolean);
    render(); toast("Guardado. Tus datos ya se ven en Staff."); return; }
  if (e.target.id === "jobForm"){ e.preventDefault();
    const f = jobUI.form, j = f.job, title = $("#jTitle").value.trim(), due = $("#jDue").value;
    if (!title || !due){ toast("Completá el trabajo solicitado y la fecha límite."); return; }
    Object.assign(j, { requestDate:$("#jReq").value, requester:$("#jRequester").value, brand:$("#jBrand").value, piece:$("#jPiece").value, title, owner:$("#jOwner").value, status:$("#jStatus").value, priority:$("#jPrio").value, complexity:$("#jComp").value, due, link:$("#jLink").value.trim(), notes:$("#jNotes").value.trim() });
    if (isFin(j) && !j.delivered) j.delivered = TODAY;
    if (f.mode === "edit"){ Object.assign(jobs.find(x => x.id === j.id), j); } else jobs.push(j);
    const m = due.slice(0,7); if (MONTHS_APP.some(x => x.v === m)) MONTH = m;
    jobUI.form = null; render(); toast(`${f.mode === "edit" ? "Guardado" : "Creado"}: ${j.id} · fecha límite ${dm(due)}. Ya aparece en el calendario.`); return; }
  if (e.target.id === "personForm"){ e.preventDefault();
    const name = $("#pName").value.trim(), email = $("#pEmail").value.trim(), role = $("#pRole").value, pass = $("#pPass").value;
    if (!name || !email.includes("@")){ toast("Completá nombre y un email válido."); return; }
    if (PEOPLE.some(x => [x.email, x.personalEmail].some(m => (m || "").toLowerCase() === email.toLowerCase()))){ toast("Ya hay una persona con ese email."); return; }
    const id = "u" + Date.now();
    const bd = $("#pBday").value;
    const person = { id, workPhone:$("#pWork").value.trim(), phone:$("#pPhone").value.trim(), mainBrand:$("#pMain").value, birthday: bd ? bd.slice(5) : null, skills:$("#pSkills").value.split(",").map(x => x.trim()).filter(Boolean), tempPass:pass, name, email, cargo:role === "Diseñador" ? "Diseñador" : role === "CM" ? "Community Manager" : role === "Admin" ? "Gerencia" : "Administración", role, brands:null, perms:new Set(ROLE_DEFAULTS[role]), active:true, mustChange:true, last:null };
    const btn = e.target.querySelector('[type="submit"]'); btn.disabled = true;
    RMH.admin({ action:"create", person_id:id, email, role, password:pass }).then(ok => { btn.disabled = false; if (!ok) return;
      PEOPLE.push(person);
      userUI.newOpen = false; userUI.lastPass = { name, pass }; refreshPeople(); render(); toast(`${name} fue creado como ${role}. Ya puede entrar con su email y la contraseña provisoria.`); }); }
  else if (e.target.id === "bdForm"){ e.preventDefault();
    const d = +$("#bdDay").value, m = +$("#bdMonth").value;
    if (!d || !m){ toast("Elegí día y mes."); return; }
    const max = new Date(2024, m, 0).getDate();
    if (d > max){ toast(`${MONTHS_ES[m-1]} tiene ${max} días.`); return; }
    viewer.birthday = String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0"); viewer.birthYear = +$("#bdYear").value || null; const z = zodiacOf(viewer.birthday); render(); toast(`Guardado: tu cumpleaños es el ${bdayLabel(viewer.birthday)}. Tu signo: ${z.s} ${z.n}.`); }
  else if (e.target.id === "pwForm"){ e.preventDefault();
    const a = $("#pwNew").value, b = $("#pwNew2").value, err = $("#pwErr");
    if (!$("#pwOld").value){ err.textContent = "Escribí tu contraseña actual."; err.hidden = false; return; }
    if (a.length < 10){ err.textContent = "La nueva contraseña tiene que tener al menos 10 caracteres."; err.hidden = false; return; }
    if (a !== b){ err.textContent = "Las dos contraseñas nuevas no coinciden."; err.hidden = false; return; }
    const form = e.target;
    RMH.changePassword($("#pwOld").value, a).then(m => { if (m){ err.textContent = m; err.hidden = false; return; } form.reset(); err.hidden = true; toast("Contraseña cambiada."); }); }
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-month],[data-rtab],[data-rbrand],[data-dl],[data-close],[data-page],[data-brand],[data-redes],[data-pedir],[data-adv-post],[data-adv-job],[data-perm],[data-pb],[data-soon]");
  if (!t) return;
  if (["calendario","calhistoria","calcanales"].includes(t.dataset.page) && brandFilter === "Todas") brandFilter = myGroups()[0];
  if (t.dataset.month){ const i = MONTHS_APP.findIndex(m => m.v === MONTH) + Number(t.dataset.month); if (MONTHS_APP[i]){ MONTH = MONTHS_APP[i].v; render(); } }
  else if (t.dataset.rtab){ reportTab = t.dataset.rtab; render(); }
  else if (t.dataset.rbrand){ reportBrand = t.dataset.rbrand; render(); }
  else if (t.dataset.dl){ toast(`En la app real se descarga “${t.dataset.dl}”. Acá la maqueta no puede descargar archivos.`); }
  else if (t.dataset.close !== undefined){ toast(`En la app real, esto deja ${monthName(MONTH)} fijo: se puede consultar pero ya no modificar.`); }
  else if (t.dataset.page){ e.preventDefault(); page = t.dataset.page; render(); window.scrollTo(0,0); }
  else if (t.dataset.brand){ brandFilter = t.dataset.brand; render(); }
  else if (t.dataset.redes){ redesBrand = t.dataset.redes; render(); }
  else if (t.dataset.pedir) pedirDiseno(t.dataset.pedir);
  else if (t.dataset.advPost) advancePost(t.dataset.advPost);
  else if (t.dataset.advJob) advanceJob(t.dataset.advJob);
  else if (t.dataset.perm){
    const [pid, key] = t.dataset.perm.split("|"); const p = PEOPLE.find(x => x.id === pid);
    p.perms.has(key) ? p.perms.delete(key) : p.perms.add(key);
    toast(`${SECTIONS.find(s => s.k === key).l}: ${p.perms.has(key) ? "habilitado" : "oculto"} para ${p.name}.`); render();
  }
  else if (t.dataset.pb){
    const [pid, b] = t.dataset.pb.split("|"); const p = PEOPLE.find(x => x.id === pid);
    let list = p.brands ? [...p.brands] : [...GROUPS];
    list = list.includes(b) ? list.filter(x => x !== b) : [...list, b];
    if (!list.length){ toast("Cada persona tiene que ver al menos una marca."); return; }
    p.brands = list.length === GROUPS.length ? null : GROUPS.filter(x => list.includes(x));
    toast(`${p.name} ahora ve: ${p.brands ? p.brands.join(", ") : "todas las marcas"}.`); render();
  }
  else if (t.dataset.soon !== undefined) toast("En la maqueta este botón no hace nada; en la app real sí.");
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-owner]"); if (!s) return;
  const j = jobs.find(x => x.id === s.dataset.owner); j.owner = s.value;
  toast(`${j.title}: asignado a ${j.owner}.`); render();
});
