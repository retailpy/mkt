<!doctype html>
<meta charset="utf-8">
<title>Retail MKT Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- App instalable (PWA): en el celular o iPad se agrega a la pantalla de inicio y abre a pantalla completa -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#020617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retail MKT Hub">
<meta name="application-name" content="Retail MKT Hub">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- Íconos: se cargan sin frenar la app (si el sitio de los íconos tarda, la app igual abre) y se dibujan apenas llegan. -->
<script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" onload="window.lucide && lucide.createIcons()"></script>
<style>
/* Estética de Plan Contenidos: tema oscuro fijo (slate-950), paneles redondeados, degradados cian→azul */
:root{
  color-scheme:dark;
  --bg:#020617; --panel:rgba(15,23,42,.95); --inner:#020617; --inner-2:rgba(2,6,23,.4);
  --line:rgba(51,65,85,.7); --line-2:#1e293b; --line-3:#334155;
  --ink:#f1f5f9; --white:#ffffff; --muted:#94a3b8; --faint:#64748b;
  --cyan:#22d3ee; --cyan-5:#06b6d4; --blue:#2563eb; --blue-5:#3b82f6;
  --good:#34d399; --bad:#f87171; --warn:#fbbf24;
  --b-superseis:#22c55e; --b-stock:#3b82f6; --b-delimarket:#f59e0b;
  --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:256px;flex:none;border-right:1px solid var(--line-2);background:rgba(2,6,23,.95);backdrop-filter:blur(4px);padding:20px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(to bottom right,#22d3ee,#2563eb);box-shadow:0 10px 15px -3px rgba(6,182,212,.2)}
.logo-mark img{width:44px;height:44px;display:block}
.logo-mark{background:none!important;box-shadow:none!important;width:44px!important;height:44px!important}
.logo b{display:block;color:#fff;font-size:16px;font-weight:600;line-height:1.2}
.logo small{font-size:12px;color:var(--faint)}
/* Logo alargado arriba de las páginas (el cuadrado va en la barra lateral) */
.brandbar{display:flex;align-items:center;gap:16px;max-width:1280px;margin:0 auto;padding:22px 24px 0;box-sizing:border-box}
.brandlogos{height:34px;width:auto}
.bclock{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.bclock svg{width:19px;height:19px}
.bclock b{color:var(--ink);font-weight:700}
@media (max-width:480px){.side .logo > div:last-child{display:none}.menubtn{max-width:calc(100vw - 110px)!important;margin-left:auto}}
@media (max-width:640px){.brandbar{gap:10px}.logo-wide{width:150px!important;min-width:0}.bclock svg{display:none}.bclock{font-size:14px}.brandlogos{height:20px!important;min-width:0}}
.logo-wide{display:block;width:260px;max-width:60vw;height:auto}
html.light .logo-wide{background:#0f172a;border-radius:12px;padding:6px 10px;box-sizing:border-box}
@media (max-width:1024px){.brandbar{padding:14px 16px 0}.logo-wide{width:200px}.brandlogos{height:24px}}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:12.5px;font-weight:400;text-transform:uppercase;letter-spacing:.16em;padding:0 12px 2px;color:rgba(34,211,238,.75)}
.nav-group.big .nav-label{display:flex;flex-direction:column;align-items:flex-start;gap:6px;white-space:nowrap}
.navtog{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-size:12.5px;text-transform:uppercase;letter-spacing:.16em;padding:4px 12px;color:rgba(34,211,238,.75);border-radius:8px}
.navtog:hover{color:var(--cyan);background:rgba(34,211,238,.06)}.navtog svg{width:15px;height:15px;transition:transform .2s;flex:none}
.nav-group.closed .navtog svg{transform:rotate(-90deg)}.nav-group.closed > a{display:none}
html.navmini .nav-group.closed > a{display:flex}
@media (max-width:767px){.nav-group.closed > a{display:flex}}
.focusbtn{all:unset;box-sizing:border-box;cursor:pointer;flex:none;white-space:nowrap;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid rgba(239,68,68,.55);color:#f87171;background:transparent;line-height:1.5}
.focusbtn:hover{background:rgba(239,68,68,.1)}
.focusbtn.team{color:var(--muted);border-color:var(--line-3)}
.focusbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.jficha .jf{display:flex;flex-direction:column;gap:14px}
.cfgtabs .chip{display:inline-flex;align-items:center;gap:7px}
.cfgtabs .chip svg{width:16px;height:16px}
.navmodes{display:none;gap:6px;justify-content:flex-end;margin:-12px 0 -10px}
.navm,.navshow{all:unset;cursor:pointer;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line-2);font-size:16px;line-height:1}
.navm:hover,.navshow:hover{color:var(--ink);border-color:var(--cyan)}
.navshow{display:none}
@media (min-width:768px){
  .navmodes{display:flex}
  html:not(.navmini) .navm[data-navmode="up"]{display:none}
  html.navmini .side{width:76px;padding:16px 10px;align-items:stretch}
  html.navmini .side .logo{justify-content:center}
  html.navmini .side .logo > div:last-child,html.navmini .nav-label,html.navmini .nav a span:not(.count),html.navmini .side-foot label,html.navmini .side-foot select{display:none}
  html.navmini .navmodes{justify-content:center;margin:0}
  html.navmini .nav a{justify-content:center;padding:10px 0;position:relative}
  html.navmini .nav a svg{width:19px;height:19px}
  html.navmini .nav a .count{position:absolute;top:2px;right:4px;margin:0;font-size:10px;padding:0 5px}
  html.navmini .nav-group.big .nav-label{display:none}
  html.navmini .nav-group{gap:2px;padding-top:6px;border-top:1px solid var(--line-2)}
  html.navmini .side-foot .logout{font-size:0;justify-content:center;padding:8px 0}
  html.navmini .side-foot .logout svg{width:18px;height:18px}
  html.navmini .sidest{padding:0;display:flex;justify-content:center}
  html.navmini .sidest .stchip{font-size:0;gap:0;padding:6px}
  html.navmini .sidest .stmenu{left:0;font-size:13px}
  html.navhidden .side{display:none}
  html.navhidden .navshow{display:grid;position:fixed;left:6px;top:50%;transform:translateY(-50%);z-index:70;background:var(--panel)}
}
.jform{display:flex;flex-direction:column;gap:16px}
.jlinks{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.jfchat .jchain{border-top:0;padding-top:0}
.jlinks .jll{font-size:13px;color:var(--muted)}
.jlrow{display:flex;gap:8px;width:100%}
.jlrow input{flex:1}
.jchain ol{gap:10px !important;padding:0 !important}
.jchain li.msg{display:flex;padding:0}
.jchain li.msg.me{justify-content:flex-end}
.jchain li.msg::before,.jchain li.ev::before{display:none}
.jchain .bub{max-width:80%;background:rgba(148,163,184,.1);border:1px solid var(--line-2);border-radius:16px 16px 16px 4px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.jchain li.msg.me .bub{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.35);border-radius:16px 16px 4px 16px}
.jchain li.msg.fx .bub{border-left:3px solid #f97316}
.jchain li.msg.me.fx .bub{border-left:1px solid rgba(34,211,238,.35);border-right:3px solid #f97316}
.jchain .bub b{font-size:12px;color:var(--muted);font-weight:600}
.jchain .bub span{align-self:flex-end}
.jchain li.ev{justify-content:center;padding:0}
.jchain li.ev>span{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:4px 12px}
.jchain li.ev>span svg{width:13px;height:13px}
.jchain li.ev.ok>span{color:#6ee7b7;border-color:rgba(16,185,129,.4)}
.jchain li.ev.bo>span{color:#67e8f9;border-color:rgba(6,182,212,.4)}
.jchain li.ev a{color:inherit}
.jlink{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.jlink label{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.jlink input{border:1px solid var(--line-3);background:var(--inner);border-radius:14px;padding:9px 12px;color:#f1f5f9;outline:none;font:inherit}
.jcext{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.jfs{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-2);border-radius:16px;padding:14px 16px}
.jfs h3{margin:0;display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink)}
.jfs h3 i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--cyan);color:var(--cyan);display:inline-grid;place-items:center;font-size:12px;font-weight:700}
.jfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:12px}
.jfg label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.jfg label.wide,.jfg label[style*="grid-column"]{grid-column:1/-1}
.jform textarea.base,.jform input.base{border:1px solid var(--line-3);background:var(--inner);border-radius:14px;padding:9px 12px;color:#f1f5f9;outline:none;font:inherit;color-scheme:dark}
.jform .chips{justify-content:flex-end}
.jchain{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-2);padding-top:12px}
.jchain h3{margin:0;font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:baseline}
.jchain ol{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:0}
.jchain li{display:flex;gap:12px;position:relative;padding-bottom:14px}
.jchain li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line-2)}
.jchain li>i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--c,#64748b);color:var(--c,#94a3b8)}
.jchain li>i svg{width:14px;height:14px}
.jchain li.bo{--c:#06b6d4}.jchain li.fx{--c:#f97316}.jchain li.nt{--c:#94a3b8}.jchain li.ok{--c:#10b981}
.jchain li b{display:block;font-size:13.5px;color:var(--ink);font-weight:600}
.jchain li p{margin:3px 0;font-size:14px;color:var(--ink);white-space:pre-wrap}
.jchain li span{font-size:12px;color:var(--faint)}
.jcin{display:flex;gap:8px;align-items:flex-end}
.jcin textarea{flex:1;background:var(--inner);border:1px solid var(--line-3);border-radius:14px;color:var(--ink);padding:9px 12px;font:inherit;outline:none;resize:vertical}
.jcin textarea:focus{border-color:var(--cyan)}
/* ---------- Chat ---------- */
.chatapp{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:14px;height:calc(100dvh - 120px);min-height:460px}
.chlist,.chconv{background:var(--panel);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chlist{padding:14px 10px;gap:4px;overflow-y:auto}
.chhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 6px}
.chhead h1{margin:0;font-size:24px}
.chsearch{margin:4px 4px 8px;border:1px solid var(--line-3);background:var(--inner);border-radius:14px;padding:8px 12px;color:var(--ink);outline:none}
.chsec{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(34,211,238,.75)}
.citem{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;cursor:pointer;width:100%}
.citem:hover{background:rgba(148,163,184,.08)}
.citem.on{background:rgba(34,211,238,.1)}
.citem .cimain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cirow{display:flex;align-items:center;gap:6px;justify-content:space-between;min-width:0}
.cirow b{font-size:14px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cirow small{font-size:11px;color:var(--faint);flex:none}
.ciprev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem.unread b{font-weight:800}
.citem.unread .ciprev{color:var(--ink);font-weight:600}
.cbadge{flex:none;background:#ef4444;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.cav{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1.5px solid var(--c);object-fit:cover}
.cavw{position:relative;flex:none;display:inline-flex}
.cavw .avatar{width:36px;height:36px}
.cavw .stdot{position:absolute;right:-1px;bottom:-1px;border:2px solid var(--panel)}
.stdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.stl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.chconv{position:relative}
.cvhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.cvhead b{display:block;font-size:16px;color:var(--ink)}
.cvhead .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.cvhead .btn.cback{display:none}
.cvmsgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.cday{display:flex;justify-content:center;margin:10px 0 4px}
.cday span{font-size:11.5px;color:var(--faint);border:1px solid var(--line-2);border-radius:999px;padding:2px 10px}
.cmsg{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;max-width:100%}
.cmsg.me{justify-content:flex-end}
.cmav{width:30px;flex:none}
.cmav .avatar{width:30px;height:30px}
.cbub{position:relative;max-width:min(560px,75%);background:rgba(148,163,184,.1);border:1px solid var(--line-2);border-radius:16px 16px 16px 4px;padding:7px 12px 6px;display:flex;flex-direction:column;gap:2px}
.cmsg.me .cbub{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.35);border-radius:16px 16px 4px 16px}
.clink{display:inline-flex;align-items:center;gap:4px;max-width:100%;vertical-align:bottom;color:var(--cyan);font-weight:600;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}.clink svg{width:14px;height:14px;flex:none}
.clink.ig{color:#f472b6}.clink.fb{color:#60a5fa}.clink.tt{color:#e2e8f0}.clink.yt{color:#f87171}
.cprev{display:flex;gap:10px;align-items:center;margin-top:6px;max-width:320px;padding:6px;border:1px solid var(--line-2);border-radius:12px;background:rgba(2,6,23,.35);color:inherit;text-decoration:none}
.cprev:hover{border-color:var(--line-3)}.cprev img,.cprev .cpic{flex:none;width:56px;height:70px;border-radius:8px;object-fit:cover;background:rgba(148,163,184,.12)}
.cprev .cpic{display:grid;place-items:center}.cprev .cpic svg{width:22px;height:22px}
.cptx{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12.5px}.cptx small{display:inline-flex;align-items:center;gap:4px;color:var(--faint);font-size:11px}.cptx small svg{width:12px;height:12px}
.cptx b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cptx em{font-style:normal;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cprev.ig .cpic{color:#f472b6}.cprev.fb .cpic{color:#60a5fa}.cprev.yt .cpic{color:#f87171}
.cwho{font-size:12px;color:var(--cyan);font-weight:700}
.ctext{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font-size:var(--cfs,14.5px);line-height:1.4}
.ctext.cbig1{font-size:calc(var(--cfs,14.5px) * 3.2);line-height:1.15}
.ctext.cbig2{font-size:calc(var(--cfs,14.5px) * 2.1);line-height:1.2}
.chatapp #chatInput{font-size:var(--cfs,14.5px)}
.cfsz{display:inline-flex;gap:4px}.cfsz .btn{min-width:34px;font-weight:600;font-size:12px}
.cavi{color:var(--c)}.cavi svg{width:19px;height:19px}
.gicos{display:flex;flex-wrap:wrap;gap:6px;border:0;padding:0;margin:0}.gicos legend{font-size:13px;color:var(--muted);margin-bottom:6px}
.gicos label{cursor:pointer}.gicos input{position:absolute;opacity:0;pointer-events:none}.gicos input:checked+.cav{outline:2px solid var(--cyan);outline-offset:2px}
.stkpanel{position:absolute;bottom:calc(100% + 6px);left:8px;right:8px;max-width:440px;background:var(--panel,#0f172a);border:1px solid var(--line-2);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:20;display:flex;flex-direction:column;gap:8px}
.stktabs{flex-wrap:nowrap;overflow-x:auto}.stkbody{max-height:300px;overflow-y:auto}
.stkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stk{position:relative}.stk>button:first-child{width:100%;aspect-ratio:1;padding:4px;border:0;border-radius:10px;background:rgba(148,163,184,.08);cursor:pointer}
.stk>button:first-child:hover{background:rgba(148,163,184,.2)}.stk img{width:100%;height:100%;object-fit:contain;display:block}
.stkfav{position:absolute;top:2px;right:2px;border:0;background:rgba(15,23,42,.7);color:#fbbf24;border-radius:8px;font-size:13px;line-height:1;padding:3px 4px;cursor:pointer}
.stkup{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.stkrule{margin:0;font-size:13px;padding:8px 10px;border-radius:10px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35)}
.stkrule svg{width:14px;height:14px;vertical-align:-2px}.stkpick{cursor:pointer}
.cstkw{position:relative;display:inline-block}
.cstkfav{position:absolute;top:2px;right:2px;border:0;background:rgba(15,23,42,.75);color:#fbbf24;border-radius:10px;font-size:15px;line-height:1;padding:4px 6px;cursor:pointer;opacity:0;transition:opacity .15s}
.cstkw:hover .cstkfav,.cstkfav.on,.cstkfav:focus-visible{opacity:1}
@media (hover:none){.cstkfav{opacity:.85}}
.cstk{display:block;width:clamp(96px,30vw,140px);height:auto;margin:2px 0}
.cgifbtn{font-size:11px;font-weight:700;letter-spacing:.04em}
.gifpanel{position:absolute;bottom:calc(100% + 6px);left:8px;right:8px;max-width:420px;background:var(--panel,#0f172a);border:1px solid var(--line-2);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:20;display:flex;flex-direction:column;gap:8px}
.gifgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:300px;overflow-y:auto}
.gifgrid button{padding:0;border:0;background:none;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1}
.gifgrid img{width:100%;height:100%;object-fit:cover;display:block}
.gifgrid .note{grid-column:1/-1;margin:6px 0}
.cgif{display:block;margin:2px 0 4px}.cgif img{display:block;width:auto;max-width:240px;max-height:240px;border-radius:10px} /* GIF chico, pegado a su lado (como WhatsApp) */
.cmsg:not(.me) .cbub.cbare{margin-right:auto}
.schat{margin-top:10px;width:100%;justify-content:center}
.ctime{align-self:flex-end;font-size:11px;color:var(--faint);display:inline-flex;align-items:center;gap:3px}

.logout{border:1px solid rgba(51,65,85,.6);background:transparent;border-radius:12px;padding:10px 12px;text-align:left;color:var(--faint);font-size:14px;transition:all .15s}
.logout:hover{background:rgba(30,41,59,.8);color:#cbd5e1}
/* Main */
.main{flex:1;min-width:0}
.content{max-width:1280px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:rgba(34,211,238,.8);margin:0 0 -18px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;color:#fff;margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--faint);margin:4px 0 0;font-size:14px}
h2{font-size:17px;margin:0 0 14px;font-weight:600;color:#fff}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 20px 25px -5px rgba(0,0,0,.2),0 8px 10px -6px rgba(0,0,0,.2)}
.panel.flush{padding:0;overflow:hidden}
.panel-h{padding:20px}
.panel-h.cyan{background:linear-gradient(to right,rgba(6,182,212,.2),rgba(59,130,246,.1),transparent)}
.panel-h.fuchsia{background:linear-gradient(to right,rgba(217,70,239,.2),rgba(168,85,247,.1),transparent)}
.panel-h h2{font-size:20px;font-weight:700;margin:0}
.panel-b{padding:16px}
.demo{border-color:rgba(6,182,212,.4);background:rgba(8,51,68,.35);display:flex;gap:12px;align-items:center;padding:14px 18px}
.demo svg{color:var(--cyan);width:20px;height:20px;flex:none}
.demo b{color:#cffafe}
.demo span{color:rgba(207,250,254,.8);font-size:13.5px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.kpi{padding:16px}
.kpi .l{color:var(--muted);font-size:14px}
.kpi .n{margin-top:4px;font-size:24px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:4px;font-size:12px;color:var(--faint)}
.up{color:var(--good)!important} .down{color:var(--bad)!important} .warn{color:var(--warn)!important}
.num{font-variant-numeric:tabular-nums}
/* pills */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--c) 60%,white);background:color-mix(in srgb,var(--c) 90%,transparent);color:var(--t,#020617)}
.brand{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;color:#e2e8f0}
.brand::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.net{font-size:11px;color:#cbd5e1;border:1px solid var(--line-3);background:var(--inner);border-radius:8px;padding:1px 6px}
.btn{border:1px solid var(--line-3);background:#0f172a;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:500;color:#e2e8f0;white-space:nowrap;transition:all .15s}
.btn:hover{background:#1e293b;color:#fff}
.btn:active,.primary:active{transform:scale(.98)}
.btn.primary{border:0;background:linear-gradient(to right,#06b6d4,#3b82f6);color:#fff;font-weight:600;box-shadow:0 10px 15px -3px rgba(6,182,212,.2)}
.btn.primary:hover{background:linear-gradient(to right,#22d3ee,#60a5fa)}
.btn svg{width:15px;height:15px;vertical-align:-2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-3);background:#0f172a;border-radius:12px;padding:6px 14px;font-size:13px;color:#cbd5e1;transition:all .15s}
.chip:hover{background:#1e293b;color:#fff}
.chip.on{border-color:transparent;background:linear-gradient(to right,#2563eb,#06b6d4);color:#fff;font-weight:600;box-shadow:0 4px 6px -1px rgba(6,182,212,.2)}
select.base{border:1px solid var(--line-3);background:var(--inner);border-radius:16px;padding:8px 12px;color:#f1f5f9;outline:none;transition:border-color .15s}
select.base:focus{border-color:var(--cyan)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 20px 25px -5px rgba(0,0,0,.2);scrollbar-width:thin;scrollbar-color:#334155 transparent}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:600;padding:14px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:#e2e8f0}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(30,41,59,.45)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stage{background:var(--inner-2);border:1px solid var(--line-2);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.stage .n{font-size:26px;font-weight:700;color:#fff}
.stage .l{font-size:12.5px;color:var(--muted)}
.pipe-note{font-size:12.5px;color:var(--faint);margin-top:12px}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line-2);background:var(--inner-2);border-radius:16px;transition:border-color .15s}
.row:hover{border-color:var(--line-3)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;color:#fff;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .date{font-size:12px;font-weight:700;color:var(--cyan);min-width:40px}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--c);box-shadow:0 0 10px var(--c)}
.empty{color:var(--faint);font-size:13px;padding:8px 2px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(min(230px,100%),1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:230px}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;color:#fff;padding:6px 8px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.col-h .num{background:rgba(2,6,23,.6);border-radius:99px;padding:0 8px;font-size:12px}
.card{background:var(--inner);border:1px solid var(--line-3);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#475569}
.card .bar-top{height:4px;background:var(--c)}
.card .in{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.card .t{font-weight:600;color:#fff}
.card .m{font-size:12px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card select{font-size:12px;border:1px solid var(--line-3);border-radius:10px;background:#0f172a;padding:3px 6px;color:#e2e8f0}
.link-post{font-size:11.5px;color:var(--cyan);font-weight:600}
/* calendar */
.calw{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#334155 transparent}
.cal{display:grid;grid-template-columns:repeat(7,minmax(168px,1fr));gap:8px;min-width:1220px} /* días anchos: el texto entra entero; si no entra en la pantalla, el calendario se desliza */
.cal .dh{text-align:center;font-size:12px;color:var(--muted);font-weight:500;padding-bottom:2px}
.cal .d{min-height:128px;border:1px solid var(--line-3);border-radius:16px;background:rgba(15,23,42,.9);padding:8px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.cal .d:hover{border-color:#475569}
.cal .d.out{background:rgba(2,6,23,.8);opacity:.6}
.cal .d .dn{font-size:13px;font-weight:600;color:#f1f5f9;padding:0 6px;align-self:flex-start;border-radius:99px}
.cal .d.today{border:2px solid #67e8f9;box-shadow:0 0 0 3px rgba(103,232,249,.28),0 12px 28px -14px rgba(103,232,249,.55);background:linear-gradient(180deg,rgba(103,232,249,.08),rgba(15,23,42,.9) 40%)}
.cal .d.today .dn{background:#67e8f9;color:#020617}
.ev{font-size:10.5px;line-height:1.25;border-radius:8px;overflow:hidden;border:1px solid color-mix(in srgb,var(--s) 45%,transparent);background:color-mix(in srgb,var(--s) 12%,#0f172a)}
.ev::before{content:"";display:block;height:3px;background:var(--c)}
.ev span{display:block;padding:3px 6px;color:#e2e8f0;white-space:normal;overflow-wrap:anywhere;font-weight:600}
.cal .ev{font-size:12px;line-height:1.3}.cal .ev .stbtn{white-space:normal}
.calw{cursor:default}.calw.panning,.calw.panning *{cursor:grabbing !important;user-select:none}
.calw::-webkit-scrollbar{height:10px}.calw::-webkit-scrollbar-thumb{background:#334155;border-radius:10px}
.ev.job{border-style:dashed;background:transparent}
.ev.sep{background:transparent!important;border:2px solid var(--c)!important}
.cmnews{display:grid;gap:12px}
.card.tapstage{cursor:pointer}.card.tapstage:hover{border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
.ev.sep::before{display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:18px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}
/* redes */
.charts svg{width:100%;height:auto;display:block}
.axis{fill:#64748b;font-size:10px;font-family:var(--sans)}
.gridl{stroke:#1e293b;stroke-width:1;stroke-dasharray:3 3}
.chartbox{border:1px solid rgba(30,41,59,.7);background:linear-gradient(to bottom,rgba(2,6,23,.6),rgba(15,23,42,.3));border-radius:16px;padding:10px}
.line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative;animation:pop .6s ease}
.donut::after{content:"";position:absolute;inset:24px;background:#0f172a;border-radius:50%}
@keyframes pop{from{transform:scale(.85);opacity:.3}}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:10px;font-size:13px;color:#cbd5e1}
.bar .tr{height:10px;background:#1e293b;border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(to right,#2563eb,#22d3ee);border-radius:99px;transform-origin:left;animation:grow .8s ease both;animation-delay:var(--dl,0ms)}
@keyframes grow{from{transform:scaleX(0)}}
.bar .v{text-align:right;font-size:12.5px;font-weight:600;color:#fff}
.tag{display:inline-block;border:1px solid var(--line-3);background:rgba(2,6,23,.6);border-radius:8px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.brandbox{border:1px solid var(--line-2);background:var(--inner-2);border-radius:16px;padding:16px}
/* permisos */
.perm td,.perm th{text-align:center;padding:10px 6px}
.perm td:first-child,.perm th:first-child{text-align:left;padding-left:18px;position:sticky;left:0;background:#0f172a;z-index:1}
.perm th{font-size:10px;letter-spacing:.06em;white-space:normal;min-width:78px;line-height:1.25}
.tog{width:44px;height:24px;border-radius:99px;border:0;background:#334155;position:relative;padding:0;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog[aria-pressed="true"]{background:#06b6d4}
.tog[aria-pressed="true"]::after{left:22px}
.tog:disabled{opacity:.5;cursor:not-allowed}
.who{display:flex;flex-direction:column;min-width:150px}
.who b{font-weight:600;color:#fff}
.who span{font-size:12px;color:var(--faint)}
.bchip{border:1px solid var(--line-3);background:var(--inner);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--faint);transition:all .15s}
.bchip.on{border-color:var(--c);color:#fff;background:color-mix(in srgb,var(--c) 25%,transparent)}
/* tv */
.tv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px}
.tv .col-h{font-size:18px;--c:#06b6d4}
.note{font-size:13px;color:var(--faint)}
.matform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.matform label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.matform label.wide{grid-column:span 2}
.matform input.base{border:1px solid var(--line-3);background:var(--inner);border-radius:16px;padding:8px 12px;color:#f1f5f9;outline:none;color-scheme:dark}
.matform input.base:focus{border-color:var(--cyan)}
@media (max-width:640px){.matform label.wide{grid-column:auto}}
/* redes */
.ftable td{padding:7px 14px;font-weight:400}
.ftable .brand{font-weight:400}
.ftable .dbadge{font-weight:500}
.ftable td.past,.ftable th.past{color:#475569}
.ftable .arow .dbadge{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0ms) + 250ms)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.noanim .ftable .dbadge{animation:none!important}
.ftable td.cur{color:#fcd34d;font-weight:700}
.ftable th.cur{color:#fcd34d}
.ftable tr.total td{font-weight:800;color:#fff;border-top:1px solid var(--line-3);background:rgba(30,41,59,.35)}
.dbadge{display:inline-block;border-radius:8px;border:1px solid;padding:1px 8px;font-size:12px;font-weight:700}
.dbadge.up{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.15);color:#6ee7b7!important}
.dbadge.down{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.15);color:#fca5a5!important}
.dbadge.eq{border-color:rgba(71,85,105,.5);background:rgba(51,65,85,.4);color:#94a3b8}
.fbars{display:flex;flex-direction:column;gap:8px;border:1px solid rgba(30,41,59,.7);background:linear-gradient(to bottom,rgba(2,6,23,.6),rgba(15,23,42,.3));border-radius:16px;padding:12px}
.fbar{display:flex;align-items:center;gap:8px}
.fbar .lb{width:130px;flex:none;font-size:12px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .tr{flex:1;height:20px;border-radius:5px;background:rgba(30,41,59,.5);overflow:hidden}
.fbar .fl{height:100%;border-radius:5px;transform-origin:left;animation:grow .9s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--dl,0ms)}
.fbar .v{width:64px;text-align:right;font-size:12px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums}
.thumb{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#0f172a),#0f172a);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.rank{font-weight:800;color:var(--cyan);width:22px;text-align:center}
.pubsel{display:flex;gap:8px;flex-wrap:wrap}
.agetxt{fill:#94a3b8;font-size:15px;font-family:var(--sans)}
.agetxt.agex{fill:#e2e8f0;font-size:19px;font-weight:700}
/* vista TV (pensadas para una tele 16:9: ocupan toda la altura) */
.tvpage{display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 48px);padding:4vh 4vw}
.tvhead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.tvclock{font-size:34px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.tvclock small{display:block;font-size:12px;font-weight:500;color:var(--faint);margin-top:4px;text-align:right}
.tvsum{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
.tvsum .panel{padding:16px 18px}
.tvteam{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:14px;min-height:0}
@media (max-width:1100px){.tvteam{grid-template-columns:repeat(2,minmax(0,1fr))}.tvsum{grid-template-columns:1fr}}
.tvp{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:220px;overflow:hidden}
.tvp .top{display:flex;align-items:center;gap:10px}
.tvp .top b{color:#fff;font-size:17px;display:block}
.tvp .top span{color:var(--faint);font-size:12.5px}
.tvp .jl{display:flex;flex-direction:column;gap:6px;flex:1}
.tvp .jr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:var(--inner-2);border:1px solid var(--line-2);font-size:13px;color:#e2e8f0}
.tvp .jr b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvp .more{font-size:12px;color:var(--faint)}
.tvp .jr{font-size:15px;padding:10px 12px}
.tvp .top b{font-size:19px}
.tvredes{min-height:calc(100vh - 48px);display:flex;flex-direction:column;gap:12px;padding:4vh 4vw}
.tvredes .tvstage{flex:1;display:flex;flex-direction:column}
.tvredes .tvslide{flex:1;display:flex;flex-direction:column}
.tvredes .tvslide > .panel,.tvredes .tvslide > .demo-wrap{flex:1;display:flex;flex-direction:column}
.tvredes .demo-grid{flex:1}
.tvredes .dcard{display:flex;flex-direction:column;justify-content:center}
.tvredes .cityrow{font-size:16px;padding:7px 0}
.tvredes .dlegend{font-size:16px}
.tvredes .fbar .tr{height:34px}
.tvredes .fbar .lb,.tvredes .fbar .v{font-size:16px}
.tvredes .fbar .lb{width:190px}
.tvredes .fcard{gap:14px;padding:18px}
.tvredes .grid.two{flex:1}
.tvpage:fullscreen,.tvredes:fullscreen{background:var(--bg);padding:6vh 6vw;overflow:auto}
.content:has(.tvpage),.content:has(.tvredes){max-width:none}
.tvredes .grid.two > div{display:flex;flex-direction:column}
.tvredes .fcard{flex:1;justify-content:space-evenly}
.tvredes .fbar .tr{height:44px;border-radius:10px}
.tvredes .fbar .lb,.tvredes .fbar .v{font-size:19px}
.tvredes .fbar .v{width:100px}
.tvredes .fhead b{font-size:22px}
.tvredes .panel > h2{font-size:32px!important}
.tvredes .demo-h b{font-size:16px}
.tvredes .demo-h span,.tvredes .demo-h small{font-size:17px}
.tvredes .dcard h3{font-size:22px;margin-bottom:18px}
.tvredes .cityrow{font-size:20px;padding:8px 0}
.tvredes .dlegend{font-size:20px;gap:8px;margin-top:0}
.tvredes .agesvg{max-height:40vh}
.tvredes .tvhero{padding:12px 24px;margin-bottom:10px}
.tvredes .tvhero .nm b{font-size:56px}
.tvredes .dcard{padding:12px 18px}
.tvredes .dcard h3{margin-bottom:10px!important}
.tvredes .ftable td:first-child,.tvredes .ftable th:first-child{padding-left:40px!important}
.tvredes .ftable td:last-child,.tvredes .ftable th:last-child{padding-right:40px!important}
.tvredes .panel-h{padding:24px 40px}
.tvredes .panel{padding:28px 36px}
.tvredes .panel.flush{padding:0}
.tvredes .demo-wrap{padding:24px}
.tvp{padding:20px 22px}
.tvsum .panel{padding:20px 24px}
.tvredes .ftable .brand{font-size:25px;font-weight:600}
.tvredes .ftable .brand::before{width:14px;height:14px}
.tvredes .demo-h{display:none}
.tvredes .d-cities{justify-content:flex-start}
.tvhero{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:18px 26px;margin-bottom:14px;border-radius:24px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(to right,color-mix(in srgb,var(--c) 22%,#0f172a),#0f172a 70%)}
.tvhero .nm{display:flex;align-items:center;gap:18px}
.tvhero .nm i{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:0 0 24px var(--c)}

.pfill.lv-green{background:linear-gradient(to right,#059669,#34d399);box-shadow:0 0 14px rgba(52,211,153,.45);animation-name:grow,c-green}
@keyframes c-red{from{background:#ef4444}}
@keyframes c-orange{0%{background:#ef4444}100%{background:#f97316}}
@keyframes c-yellow{0%{background:#ef4444}50%{background:#f97316}100%{background:#eab308}}

.tvredes .tvhero .nm span{font-size:clamp(11px,1.5vh,16px);margin-top:4px}

.tvredes .ftable .brand{font-size:clamp(16px,min(2.4vh,1.5vw),25px)}
.tvredes .ftable td{font-size:clamp(14px,min(2vh,1.35vw),21px)}
.tvredes .ftable th{font-size:clamp(11px,.95vw,14px);letter-spacing:.1em}

/* v29 · Vista TV Team: 5 diseñadores + 4 CM en una pantalla */
.tvpage{gap:clamp(14px,1.8vh,24px)}
.tvsum{gap:clamp(16px,1.4vw,28px)}
.tvsum .panel{padding:clamp(12px,1.6vh,20px) 24px}
.tvrow{display:flex;flex-direction:column;gap:clamp(8px,1vh,12px);flex:1;min-height:0}
.tvrow-h{display:flex;align-items:baseline;gap:14px;padding-left:4px}
.tvrow-h b{font-size:clamp(15px,2vh,20px);letter-spacing:.14em;text-transform:uppercase;color:#67e8f9}
.tvrow-h span{font-size:clamp(13px,1.6vh,16px);color:var(--faint)}
.tvgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(16px,1.4vw,28px)}
.tvgrid .tvp{min-height:0;padding:clamp(14px,1.8vh,22px) clamp(14px,1.1vw,22px);gap:clamp(8px,1.1vh,12px);border-radius:22px;border:1px solid var(--line-3);box-shadow:0 18px 30px -12px rgba(0,0,0,.5)}
.tvgrid .tvp .top{display:flex;align-items:center;gap:12px}
.tvgrid .tvp .avatar{width:clamp(40px,5vh,56px);height:clamp(40px,5vh,56px);border-radius:16px;font-size:clamp(14px,1.8vh,19px);flex:none}
.tvgrid .tvp .who{min-width:0;flex:1}
.tvgrid .tvp .who b{display:block;color:#fff;font-size:clamp(17px,2.3vh,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvgrid .tvp .who span{display:block;color:var(--muted);font-size:clamp(12px,1.5vh,15px)}
.tvgrid .tvp .pct{font-size:clamp(26px,3.8vh,42px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.tvgrid .tvp .pct span{font-size:inherit;color:inherit}
.tvgrid .tvp .ptrack{height:clamp(10px,1.4vh,16px)}
.tvgrid .tvp .cnt{display:flex;gap:12px;flex-wrap:wrap;font-size:clamp(12px,1.6vh,16px);color:var(--muted)}
.tvgrid .tvp .cnt i{font-style:normal;font-weight:800;color:#fff;font-size:1.2em}
.tvgrid .tvp .jl{display:flex;flex-direction:column;gap:clamp(5px,.8vh,8px);flex:1;min-height:0;overflow:hidden}
.tvgrid .tvp .jr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:clamp(6px,.9vh,10px) 10px;border-radius:12px;background:var(--inner-2);border:1px solid var(--line-2);border-left:4px solid var(--b);font-size:clamp(13px,1.7vh,17px)}
.tvgrid .tvp .jr b{font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tvgrid .tvp .ub{flex:none;font-size:clamp(11px,1.4vh,14px);font-weight:800;padding:2px 8px;border-radius:99px;color:var(--u);border:1px solid color-mix(in srgb,var(--u) 55%,transparent);background:color-mix(in srgb,var(--u) 16%,transparent);white-space:nowrap}
.tvgrid .tvp .ub.late{background:var(--u);color:#fff;animation:pulse 1.4s ease-in-out infinite}
.tvgrid .tvp .dd{flex:none;font-size:clamp(11px,1.4vh,14px);color:var(--faint);font-variant-numeric:tabular-nums}
.tvgrid .tvp .more{font-size:clamp(12px,1.4vh,14px);color:var(--faint)}
.tvgrid .tvp .empty{padding:8px;font-size:15px}
.tvpage:fullscreen{height:100vh;padding:4vh 4vw}
/* v29 · números más grandes en la TV de seguidores */
.tvredes .fbar .v{font-size:clamp(18px,min(3vh,1.7vw),32px)!important;font-weight:800;width:auto;min-width:clamp(90px,8vw,150px)}
.tvredes .fbar .lb{font-size:clamp(15px,min(2.3vh,1.3vw),23px)!important}
.tvredes .ftable td.num{font-size:clamp(15px,min(2.5vh,1.5vw),27px)}
.tvredes .ftable td.cur{font-size:clamp(17px,min(3vh,1.8vw),32px);font-weight:800}
.tvredes .ftable .dbadge{font-size:clamp(14px,min(2vh,1.25vw),20px)}

/* v29b · tarjetas del equipo más ordenadas */
.tvsum.one{grid-template-columns:1fr}
.tvsum.one .panel{padding:clamp(10px,1.4vh,18px) 26px}
.tvsum.one .pmeta{font-size:clamp(13px,1.7vh,17px)}
.tvrow-h{align-items:center}
.tvrow-h .rbar{flex:1;display:flex;align-items:center;gap:12px;max-width:520px;margin-left:auto}
.tvrow-h .rbar .ptrack{flex:1;height:12px}
.tvrow-h .rbar em{font-style:normal;font-weight:900;font-size:clamp(18px,2.4vh,26px);font-variant-numeric:tabular-nums}
.tvgrid .tvp .pline{display:flex;align-items:center;gap:12px}
.tvgrid .tvp .pline .ptrack{flex:1}
.tvgrid .tvp .pct{font-size:clamp(24px,3.4vh,38px)}
.tvgrid .tvp .cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-size:clamp(11px,1.35vh,14px);color:var(--muted)}
.tvgrid .tvp .cnt div{background:rgba(2,6,23,.45);border:1px solid var(--line-2);border-radius:12px;padding:clamp(4px,.7vh,8px) 2px}
.tvgrid .tvp .cnt i{display:block;font-size:clamp(18px,2.6vh,28px);line-height:1.1}

.teamline{display:flex;align-items:center;gap:clamp(14px,1.4vw,26px)}
.teamline > b{color:#fff;font-size:clamp(16px,2.1vh,22px);white-space:nowrap}
.teamline > b span{color:var(--muted);font-weight:500}
.teamline .ptrack{flex:1;height:clamp(14px,2vh,22px)}
.teamline em{font-style:normal;font-weight:900;font-size:clamp(24px,3.6vh,40px);font-variant-numeric:tabular-nums}
.teamline em span{font-size:inherit;color:inherit}
.teamline .tm{display:flex;gap:14px;font-size:clamp(13px,1.7vh,17px);color:var(--muted);white-space:nowrap}
.teamline .tm i{font-style:normal;font-weight:800;color:#fff}
.tvgrid .tvp .cnt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10.5px,1.3vh,14px)}
.tvgrid .tvp .jr{flex:none}
@media (max-width:1700px){.teamline .tm span:last-child{display:none}}

.tvgrid .tvp{gap:clamp(6px,.9vh,11px)}
.tvgrid .tvp .cnt div{padding:clamp(2px,.5vh,6px) 2px}
.tvgrid .tvp .cnt i{font-size:clamp(16px,2.2vh,25px)}
.tvgrid .tvp .jr[hidden]{display:none}
.tvgrid .tvp .more{flex:none;margin-top:-2px}
.tvsum.one .panel.teamline{padding:clamp(8px,1.2vh,16px) 26px}
.tvpage{gap:clamp(10px,1.5vh,22px)}
.tvredes .fbar .lb{width:clamp(150px,13vw,240px)!important}
.tvgrid .tvp .jl{position:relative}

/* v30 · Vista TV Team sin superposiciones: la página crece si hace falta, nunca se enciman las tarjetas */
.tvpage{height:auto;min-height:calc(100vh - 48px)}
.tvpage:fullscreen{height:100vh;min-height:0;overflow-y:auto}
.tvpage > *{flex-shrink:0}
.tvrow{flex:1 0 auto;min-height:auto}
.tvgrid{flex:1 0 auto;min-height:auto;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-auto-rows:1fr}
.tvgrid .tvp{min-height:auto;min-width:0;overflow:visible}
.tvgrid .tvp .jl{flex:1 0 auto;overflow:visible}
.tvhead{row-gap:10px}
@media (max-width:1100px){.tvrow-h{flex-wrap:wrap}.tvrow-h .rbar{max-width:none;flex-basis:100%;margin-left:0}.teamline{flex-wrap:wrap}.teamline .ptrack{flex-basis:200px}}

/* v30 · todo el sitio aparece animado cuando entra en pantalla */
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease,transform .65s cubic-bezier(.22,1,.36,1);transition-delay:var(--rd,0ms)}
.cal .d.rv{transform:scale(.94)}
.cal .d.rv.in{transform:none}
.ev.rv{transform:translateX(-8px)}
.ev.rv.in{transform:none}

/* v30b · el contenido de cada tarjeta se adapta a su ancho (container queries) */
.tvgrid .tvp{container-type:inline-size}
@container (min-width:0px){
  .tvgrid .tvp .who b{font-size:clamp(14px,8cqi,24px)}
  .tvgrid .tvp .who span{font-size:clamp(11px,5cqi,15px)}
  .tvgrid .tvp .avatar{width:clamp(34px,17cqi,56px);height:clamp(34px,17cqi,56px);font-size:clamp(12px,6cqi,19px);border-radius:clamp(10px,5cqi,16px)}
  .tvgrid .tvp .pct{font-size:clamp(20px,12.5cqi,40px)}
  .tvgrid .tvp .cnt div{font-size:clamp(9px,4.2cqi,14px)}
  .tvgrid .tvp .cnt i{font-size:clamp(15px,8.5cqi,26px)}
  .tvgrid .tvp .jr{font-size:clamp(11.5px,5.4cqi,17px)}
  .tvgrid .tvp .ub,.tvgrid .tvp .dd{font-size:clamp(9.5px,4.3cqi,14px)}
  .tvgrid .tvp .more{font-size:clamp(10.5px,4.5cqi,14px)}
}
.tvgrid .tvp .cnt .sh{display:none}
@container (max-width:250px){.tvgrid .tvp .cnt .lg{display:none}.tvgrid .tvp .cnt .sh{display:inline}}

/* v31 · Vista TV Team en dos pantallas (Diseño → CM) */
.ttstage{flex:1 0 auto;display:flex;flex-direction:column}
.ttslide{flex:1 0 auto;display:flex;flex-direction:column;gap:clamp(12px,1.8vh,22px);animation:tvin .6s cubic-bezier(.22,1,.36,1) both}
.ttsum{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,1.4vw,28px)}
.ttbar{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:clamp(12px,1.8vh,20px) 26px;display:flex;flex-direction:column;gap:10px}
.ttbar.area{border-color:rgba(34,211,238,.45);background:linear-gradient(135deg,rgba(8,51,68,.55),var(--panel))}
.ttbar .tth{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ttbar .tth b{color:#fff;font-size:clamp(17px,2.4vh,26px)}
.ttbar .tth b small{color:var(--muted);font-weight:500;font-size:.75em}
.ttbar .tth em{font-style:normal;font-weight:900;font-size:clamp(26px,4vh,46px);line-height:1;font-variant-numeric:tabular-nums}
.ttbar .tth em span{font-size:inherit;color:inherit}
.ttbar .ptrack{height:clamp(14px,2vh,22px)}
.ttbar .ttm{display:flex;gap:18px;flex-wrap:wrap;font-size:clamp(13px,1.8vh,18px);color:var(--muted)}
.ttbar .ttm i{font-style:normal;font-weight:900;color:#fff;font-size:1.25em}
.ttbar .ttm .g i{color:#34d399}.ttbar .ttm .r i{color:#f87171}
.tthead{display:flex;align-items:center;gap:16px}
.tthead b{font-size:clamp(20px,3vh,32px);letter-spacing:.12em;text-transform:uppercase;color:#67e8f9}
.tthead span{color:var(--faint);font-size:clamp(14px,1.8vh,18px)}
.tthead .ttdots{margin-left:auto;display:flex;gap:8px}
.tthead .tvdot{width:14px;height:14px}
.tvpage .tvtimer{margin:0}
.tvpage .tvgrid{flex:1 0 auto}
.tvgrid .tc{animation:tcin .7s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--k) * 90ms + 150ms)}
@keyframes tcin{from{opacity:0;transform:translateY(24px) scale(.97)}}
.cnt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.cnt3 div{border-radius:14px;padding:clamp(6px,1vh,12px) 4px;border:1px solid var(--line-2);background:rgba(2,6,23,.45)}
.cnt3 i{display:block;font-style:normal;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;font-size:clamp(26px,16cqi,58px)}
.cnt3 span{display:block;margin-top:4px;color:#cbd5e1;font-weight:600;font-size:clamp(11px,5cqi,16px)}
.cnt3 .g{border-color:rgba(52,211,153,.45);background:rgba(6,78,59,.35)}.cnt3 .g i{color:#34d399}
.cnt3 .y{border-color:rgba(96,165,250,.35);background:rgba(30,58,138,.25)}.cnt3 .y i{color:#93c5fd}
.cnt3 .r{border-color:rgba(248,113,113,.5);background:rgba(127,29,29,.35)}.cnt3 .r i{color:#f87171}
@container (min-width:0px){
  .tvgrid .tc .who b{font-size:clamp(16px,9cqi,30px)}
  .tvgrid .tc .who span{font-size:clamp(12px,5.2cqi,17px)}
  .tvgrid .tc .avatar{width:clamp(40px,19cqi,64px);height:clamp(40px,19cqi,64px);font-size:clamp(14px,7cqi,22px)}
  .tvgrid .tc .pct{font-size:clamp(24px,14cqi,48px)}
  .tvgrid .tc .jr{font-size:clamp(12.5px,5.8cqi,19px)}
  .tvgrid .tc .ub,.tvgrid .tc .dd{font-size:clamp(10.5px,4.6cqi,15px)}
}
@media (max-width:1000px){.ttsum{grid-template-columns:1fr}}
.cardin{animation:cardin .6s cubic-bezier(.22,1,.36,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(22px) scale(.96)}}

.cnt3{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(4px,2.5cqi,10px)}
.cnt3 div{min-width:0;padding:clamp(6px,1vh,12px) 2px}
.cnt3 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(9px,4.4cqi,16px)}
.tvgrid .tc .jl::before{content:"Próximas entregas";display:block;font-size:clamp(10px,4cqi,13px);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:2px 0 2px}

/* v32 · carga de trabajo en columnas */
.loadchart{display:flex;flex-direction:column;gap:10px}
.lgroups{display:flex;gap:18px;align-items:stretch;height:260px}
.lgroup{display:flex;flex-direction:column;min-width:0;border-radius:18px;background:rgba(2,6,23,.35);border:1px solid var(--line-2);padding:10px 10px 8px}

.lval span{font-size:11px;color:var(--faint)}

.lbar{width:100%;border-radius:12px 12px 4px 4px;background:linear-gradient(to top,color-mix(in srgb,var(--c) 55%,#0f172a),var(--c));box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent);transform-origin:bottom;animation:growy 1s cubic-bezier(.22,1,.36,1) both}

.lname .avatar{width:30px;height:30px;border-radius:10px;font-size:11px}
.lname b{color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lname span{font-size:10.5px;font-weight:700;white-space:nowrap}
.lglabel{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#67e8f9;margin-top:8px;padding-top:6px;border-top:1px solid var(--line-2)}
.llegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--faint)}

@media (max-width:760px){.lgroups{flex-direction:column;height:auto}.lgroup .lcols{height:220px}}
/* versión TV: llena la pantalla */
.ttload{flex:1 0 auto;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:clamp(14px,2vh,24px)}
.loadchart.tv{flex:1;min-height:0}

.recform{grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-3);border-radius:16px;padding:14px}
.recform .w2{grid-column:span 2}
@media (max-width:760px){.recform{grid-template-columns:1fr}.recform .w2{grid-column:auto}}
.recdays{display:flex;flex-direction:column;gap:6px}
.reclist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:10px}
.recitem{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line-3);border-left:4px solid var(--k);border-radius:14px;padding:10px 12px;background:rgba(15,23,42,.6)}
.recitem .rk{font-size:22px;line-height:1.2}
.recitem b{color:#fff;font-size:14.5px}
.recitem .m{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.recitem .rkind{color:var(--k);font-weight:700}
.recitem .btn.danger.sm{opacity:0}.recitem:hover .btn.danger.sm{opacity:1}
@media (hover:none){.recitem .btn.danger.sm{opacity:1}}
.rech{margin:4px 0 -4px;font-size:14px;color:#a5f3fc;letter-spacing:.04em}
.recnext{display:flex;flex-direction:column;gap:6px}
.rn{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-left:3px solid var(--k);border-radius:12px;padding:7px 10px;font-size:13.5px;color:#e2e8f0}
.rn.done{opacity:.6}
.rn .rnd{min-width:78px;font-weight:700;color:#fff;display:flex;flex-direction:column;line-height:1.2}
.rn .rnd small{font-weight:500;color:var(--muted)}
.ev.rec{border-style:solid;border-left:3px solid var(--s);cursor:pointer}
.ev.rec.done{opacity:.55}
.recat{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line-3);border-radius:12px}
.ev.rec.done span:first-child{text-decoration:line-through}
.caltabs{margin-top:-8px}
/* v66 · turnos sábados */
.satgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}
.satcard{display:flex;flex-direction:column;gap:10px}
.satcard header{display:flex;justify-content:space-between;align-items:flex-start}
.satcard .sdw{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#67e8f9}
.satcard .sdn{display:block;font-size:40px;font-weight:900;line-height:1;color:#fff}
.satcard .scap{font-weight:800;font-size:13px;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:2px 9px}
.satcard.past{opacity:.55}
.satcard.today{border-color:#67e8f9}
.soff{display:flex;flex-direction:column;gap:6px;flex:1}
.sperson{display:flex;align-items:center;gap:8px}
.sperson .avatar{width:28px;height:28px;border-radius:9px;font-size:11px}
.sperson b{display:block;color:#fff;font-size:13.5px;line-height:1.1}
.sperson small{color:var(--muted);font-size:11.5px}
.swarn{font-size:12.5px;color:#fca5a5;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:5px 8px}

/* v67 · apodo y datos pendientes */
.scard .snick{display:block;color:#67e8f9!important;font-size:12.5px;font-weight:600}
.spend{margin:0;font-size:12.5px;color:#fde68a;background:rgba(113,63,18,.3);border:1px solid rgba(234,179,8,.4);border-radius:10px;padding:6px 9px}

/* v68 · se usa como app: barra de pestañas abajo en el celular, pantalla completa, sin rebote ni resaltado al tocar */
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,.btn,.chip,.nav a,.tabbar a,.tabbar button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.tabbar{display:none}
@media (max-width:767px){

  .tabbar .tbi{position:relative;display:grid;place-items:center;width:44px;height:28px;border-radius:99px;transition:background .15s}
  .tabbar svg{width:21px;height:21px}
  .tabbar .on{color:#e0f2fe}
  .tabbar .on .tbi{background:linear-gradient(to right,rgba(37,99,235,.55),rgba(6,182,212,.45))}
  .tabbar .tbc{position:absolute;top:-3px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center}
  .main{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  .side.open{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

function dropTarget(e){
  if (!drag) return null;
  if (drag.kind === "nitem"){ const c = e.target.closest("[data-nit]"); return c && c.dataset.nit.split("|")[0] === drag.id.split("|")[0] && c.dataset.nit !== drag.id ? c : null; }

const CX_W = { Baja:1, Media:2, Alta:3 };
const LOAD_FULL = 10; // puntos que se consideran “carga completa” (ajustable en Configuración)
const POST_PENDING = ["Borrador","En diseño","Listo"];
function loadOf(name){ const open = jobs.filter(j => j.owner === name && !isClosedJob(j)); const pp = posts.filter(p => p.cm === name && p.date.slice(0,7) === CURRENT_MONTH && POST_PENDING.includes(p.status)); return { n:open.length + pp.length, pts:open.reduce((a, j) => a + (CX_W[j.complexity] || 2), 0) + pp.length }; }
// Zonas (sobre la capacidad): 0-49 % verde = zona ideal · 50-79 % amarillo · 80-99 % naranja · 100 % o más rojo.

const campSync = () => postsUpdated();
const campStale = () => { const s = campSync(); return !s || (Date.now() - new Date(s).getTime()) > 48 * 3600e3; };
const impPubs = () => publicationsFor(impMonth());
function impSlides(){ return [{ general:true, label:"Lo mejor de cada marca" }, ...socialBrands().map(b => ({ brand:b, label:b }))]; }
function impStatus(){
  const s = campSync();
  if (!s) return `<div class="impwarn">${icon("cloud-off")} <b>Datos no disponibles</b><span>Todavía no llegaron publicaciones desde Meta.</span></div>`;
  return campStale() ? `<div class="impwarn">${icon("triangle-alert")} <b>Datos desactualizados</b><span>Última actualización: ${metaWhen(s)}. Lo que ves no es de hoy.</span></div>` : "";
}
function impSlide(sl){
  const pubs = impPubs(), ml = monthLabel(impMonth()), n = v => isNum(v) ? dots(v) : "—";
  const row = (p, k, brandCol) => `<tr style="--k:${k}"><td class="rk">${k + 1}</td>${brandCol ? `<td><span class="bname" style="--c:${BRANDS[p.brand]}"><i></i>${p.brand}</span></td>` : ""}<td class="ttl"><div class="person">${pubThumb(p)}<div><span class="tt">${esc(p.title)}</span><small>${p.format} · ${dm(p.date)}</small></div></div></td><td class="r big">${n(p.reach)}</td><td class="r">${n(p.likes)}</td><td class="r">${n(p.comments)}</td><td class="r">${dots(p.inter)}</td></tr>`;
  const head = brandCol => `<thead><tr><th>#</th>${brandCol ? "<th>Marca</th>" : ""}<th>Publicación</th><th class="r">Alcance</th><th class="r">Me gusta</th><th class="r">Comentarios</th><th class="r">Interacciones</th></tr></thead>`;
  if (sl.general){
    const best = socialBrands().map(b => pubs.filter(p => p.brand === b).sort((a, c) => pubScore(c) - pubScore(a))[0]).filter(Boolean).sort((a, c) => pubScore(c) - pubScore(a));
    return `<div class="impslide"><div class="imphead"><div class="it">${ICO.top}<div><b>Lo mejor de cada marca</b><span>La publicación de Instagram con más alcance (o interacciones) de cada cuenta · ${ml}</span></div></div></div>
      ${best.length ? `<div class="imptw"><table class="imptable">${head(true)}<tbody>${best.map((p, k) => row(p, k, true)).join("")}</tbody></table></div>` : `<div class="empty">Todavía no hay publicaciones de ${monthName(impMonth())} cargadas desde Meta.</div>`}</div>`;
  }
  const b = sl.brand, f = folOf(b, folMonth(impMonth())), fn = v => isNum(v) ? dots(v) : NO_DATA;
  const list = pubs.filter(p => p.brand === b).sort((a, c) => pubScore(c) - pubScore(a)).slice(0, 10);
  const tot = k => list.reduce((a, p) => a + (+p[k] || 0), 0);
  return `<div class="impslide">
    <div class="tvhero imphero" style="--c:${BRANDS[b]}"><div class="nm"><i></i><div><b>${b}</b><span>Top 10 publicaciones de Instagram · ${ml}</span></div></div>
      <div class="impnums"><div><em>${ICO.IG}${fn(f?.ig)}</em><small>seguidores en Instagram</small></div><div><em>${ICO.FB}${fn(f?.fb)}</em><small>seguidores en Facebook</small></div><div><em>${ICO.heart}${list.length ? dots(tot("likes")) : "—"}</em><small>me gusta del top 10</small></div><div><em>${ICO.eye}${list.some(p => isNum(p.reach)) ? dots(tot("reach")) : "—"}</em><small>alcance del top 10</small></div></div></div>
    ${list.length ? `<div class="imptw"><table class="imptable">${head(false)}<tbody>${list.map((p, k) => row(p, k, false)).join("")}</tbody></table></div>` : `<div class="empty">Todavía no hay publicaciones de ${b} de ${monthName(impMonth())} cargadas desde Meta.</div>`}</div>`;
}

function impShow(n){
  const st = document.getElementById("impStage"); if (!st) return;
  const sl = impSlides(); imp.i = (n + sl.length) % sl.length;
  const wrap = document.querySelector("#content > div"); if (wrap) wrap.classList.remove("noanim");
  st.innerHTML = `<p class="tvtitle">${sl[imp.i].general ? "Lo mejor de cada marca" : "Top 10 · " + sl[imp.i].brand} · ${imp.i + 1} de ${sl.length}</p><div class="tvslide">${impSlide(sl[imp.i])}</div>`;
  document.querySelectorAll("[data-impgo]").forEach((d, k) => d.classList.toggle("on", k === imp.i));
  const bar = document.getElementById("impBar"); if (bar){ bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = `tvt ${IMP_SECS}s linear both`; bar.style.animationPlayState = imp.paused ? "paused" : "running"; }
}
function impLoop(){ clearInterval(imp.t); imp.t = setInterval(() => { if (!imp.paused && page === "tvimpacto") impShow(imp.i + 1); }, IMP_SECS * 1000); }
function impStop(){ clearInterval(imp.t); imp.t = null; }
document.addEventListener("click", e => {
  const g = e.target.closest("[data-impgo]"); if (g){ impShow(+g.dataset.impgo); impLoop(); return; }
  const t = e.target.closest("[data-imp]"); if (!t) return; const a = t.dataset.imp;
  if (a === "next" || a === "prev"){ impShow(imp.i + (a === "next" ? 1 : -1)); impLoop(); }

  if (user && userTaken(user, pp.id)){ toast(`El usuario “${user}” ya lo tiene otra persona.`); return; }

// Teléfonos en formato local con el prefijo entre paréntesis: 0981111222 o +595 981 111 222 → (0981) 111 222.
function fmtPhone(v){
  const raw = String(v || "").trim(); let d = raw.replace(/\D/g, "");
  if (d.startsWith("595")) d = "0" + d.slice(3);
  if (!d.startsWith("0") || d.length < 7) return raw;
  const n = d.startsWith("021") ? 3 : 4, rest = d.slice(n);
  const groups = rest.length === 7 ? [rest.slice(0, 3), rest.slice(3)] : rest.match(/.{1,3}/g);
  return `(${d.slice(0, n)}) ${groups.join(" ")}`;
}

function advancePost(postId){
  const p = postById(postId);
  const next = { "Listo":"Programado", "Programado":"Publicado", "Publicado":"Pautado" }[p.status];
  if (!next) return;
  p.status = next; toast(`“${p.title}” pasó a ${next}.`); render();
}
function advanceJob(jobId){
  const j = jobs.find(x => x.id === jobId);
  const st = stagesOf(j), i = st.indexOf(j.status);
  if (i >= st.length-1) return;
  j.status = st[i+1];
  if (j.status === "Aprobado") j.approved = TODAY;
  if (isFin(j) && !j.delivered) j.delivered = TODAY;
  if (j.status === "Aprobado" && j.area !== "CM" && j.post){
    const p = postById(j.post);

const ALERT_SRC = [["avisos","Avisos del equipo","megaphone"],["pedidos","Pedidos de diseño","palette"],["gestion","Gestión de redes","layout-grid"],["calendario","Calendario de publicaciones","calendar-days"],["pautas","Meta Ads","target"],["equipo","Equipo","users"],["otros","Otros","bell"]];
function alertSrc(a){
  const g = a.go || "", k = a.key || "";
  if (k.startsWith("av:")) return "avisos";
  if (g.startsWith("job:")){ const j = jobById(g.slice(4)); return j && j.area === "CM" ? "gestion" : "pedidos"; }

function calCells(){
  const first = new Date(MONTH + "-01T12:00");
  const offset = (first.getDay() + 6) % 7;
  const cells = [];
  const total = Math.ceil((offset + lastDay(MONTH)) / 7) * 7;
  for (let i = 0; i < total; i++){ const d = new Date(first); d.setDate(1 - offset + i); cells.push(d.toISOString().slice(0,10)); }
  return cells;
}
// Deslizar todo el calendario a izquierda/derecha con el mouse (agarrando un lugar vacío); con el dedo ya se desliza solo.
document.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  const w = e.target.closest(".calw"); if (!w || w.scrollWidth <= w.clientWidth + 4 || e.target.closest(".ev,.pev,button,a,input,select,[draggable=true]")) return;
  const x0 = e.clientX, s0 = w.scrollLeft; let moved = false;
  const mv = ev => { const dx = ev.clientX - x0; if (!moved && Math.abs(dx) < 6) return; moved = true; w.classList.add("panning"); w.scrollLeft = s0 - dx; };
  const up = () => { document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); w.classList.remove("panning");
    if (moved){ const eat = ev => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener("click", eat, true); setTimeout(() => document.removeEventListener("click", eat, true), 0); } };
  document.addEventListener("pointermove", mv); document.addEventListener("pointerup", up);
});

function cleanRich(html){
  const t = document.createElement("template"); t.innerHTML = String(html || "");
  const walk = node => [...node.childNodes].map(n => {
    if (n.nodeType === 3) return esc(n.nodeValue);
    if (n.nodeType !== 1) return "";
    const tag = n.tagName, inner = walk(n);
    if (tag === "FONT"){ const sz = +n.getAttribute("size"); return sz >= 5 ? `<span class="rt-l">${inner}</span>` : sz && sz <= 2 ? `<span class="rt-s">${inner}</span>` : inner; }
    if (tag === "SPAN"){ const c = n.className; return c === "rt-l" || c === "rt-s" ? `<span class="${c}">${inner}</span>` : inner; }
    // Imágenes: solo las subidas a Google Drive (se guarda el id; la imagen no ocupa lugar en la base).
    // Una que todavía se está subiendo (sin id) no se guarda.
    if (tag === "IMG"){ const id = n.getAttribute("data-drive") || ""; return /^[\w-]{10,80}$/.test(id) ? rtImg(id) : ""; }
    const k = RT_TAGS[tag]; if (k === undefined) return inner;
    return k === "br" ? "<br>" : `<${k}>${inner}</${k}>`;
  }).join("");

}

function spawnPostRepeats(){

  let n = 0;
  [[posts, false], [CHANNEL_POSTS, true]].forEach(([list, canal]) => list.filter(t => t.rep?.days?.length && !t.repOf && (viewer.role === "Admin total" || t.cm === viewer.name)).forEach(t => {

      const id = `${t.id}-R${d.slice(2).replace(/-/g, "")}`; if (list.some(x => x.id === id || (x.repOf === t.id && x.date === d))) continue;
      const c = { id, date:d, status:"Borrador", repOf:t.id, brand:t.brand, title:t.title, cm:t.cm, requester:t.requester || "Marketing", notes:t.notes || "", brief:t.brief || "",

function tvFit(){

  document.querySelectorAll(".tvpage .tvgrid").forEach(g => {
    const n = g.children.length, gap = parseFloat(getComputedStyle(g).columnGap) || 16;
    let c = Math.max(1, Math.min(n, Math.floor((g.clientWidth + gap) / (230 + gap))));
    c = Math.ceil(n / Math.ceil(n / c)); g.style.setProperty("--n", c);
  });
  const cards = [...pg.querySelectorAll(".tvgrid .tvp")];
  const fits = () => document.fullscreenElement === pg ? pg.scrollHeight <= pg.clientHeight + 1 : document.scrollingElement.scrollHeight <= innerHeight + 1;
  for (const k of [6, 5, 4, 3, 2, 1]){
    cards.forEach(c => { const rows = [...c.querySelectorAll(".jr")], more = c.querySelector(".more"), hid = Math.max(0, rows.length - k);
      rows.forEach((r, i) => r.hidden = i >= k); more.hidden = !hid; more.textContent = hid ? `+ ${hid} ${hid === 1 ? "tarea más" : "tareas más"}` : ""; });
    if (fits()) break;
  }
}

// PDF: la impresión del navegador (“Guardar como PDF”) con una hoja limpia: el análisis del mes y el informe elegido.
// Excel (.xlsx): se arma acá mismo, sin librerías: una hoja con el análisis y una hoja por cada tabla del informe.
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
// Un .zip sin compresión (así es por dentro un .xlsx).
function zipStore(files, type){
  const enc = new TextEncoder(), parts = [], dir = []; let off = 0;
  for (const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data), h = new DataView(new ArrayBuffer(30)), c = new DataView(new ArrayBuffer(46));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [12, 0x21, 2], [14, crc, 4], [18, f.data.length, 4], [22, f.data.length, 4], [26, nm.length, 2]].forEach(([o, v, s]) => s === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [14, 0x21, 2], [16, crc, 4], [20, f.data.length, 4], [24, f.data.length, 4], [28, nm.length, 2], [42, off, 4]].forEach(([o, v, s]) => s === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
    parts.push(h, nm, f.data); dir.push(c, nm); off += 30 + nm.length + f.data.length;
  }
  const size = dir.reduce((a, x) => a + x.byteLength, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...dir, e], { type });
}
// sheets: [{ name, rows:[[valor | { v, s }]] }] · s: 1 negrita, 2 texto largo (ajustado). Los números van como números.
function xlsxBlob(sheets){
  const x = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const col = i => { let s = ""; for (i++; i; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
  const cell = (v, r, j) => { const o = v && typeof v === "object" ? v : { v }, ref = col(j) + r, st = o.s ? ` s="${o.s}"` : "";
    return o.v == null || o.v === "" ? "" : typeof o.v === "number" && isFinite(o.v) ? `<c r="${ref}"${st}><v>${o.v}</v></c>` : `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${x(o.v)}</t></is></c>`; };
  const sheetXml = s => { const w = []; s.rows.forEach(r => r.forEach((v, j) => { const o = v && typeof v === "object" ? v : { v }; w[j] = Math.max(w[j] || 8, Math.min(o.s === 2 ? 100 : 60, String(o.v ?? "").length + 2)); }));
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${w.length ? `<cols>${w.map((v, j) => `<col min="${j + 1}" max="${j + 1}" width="${v}" customWidth="1"/>`).join("")}</cols>` : ""}<sheetData>${s.rows.map((r, i) => `<row r="${i + 1}">${r.map((v, j) => cell(v, i + 1, j)).join("")}</row>`).join("")}</sheetData></worksheet>`; };
  const names = [];
  sheets.forEach((s, i) => { let n = String(s.name || `Hoja ${i + 1}`).replace(/[\\/?*[\]:]/g, " ").replace(/\s+/g, " ").trim().slice(0, 31) || `Hoja ${i + 1}`; while (names.includes(n)) n = n.slice(0, 27) + " (" + (i + 1) + ")"; names.push(n); });
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', NS = "http://schemas.openxmlformats.org", enc = new TextEncoder();
  const files = [
    ["[Content_Types].xml", `${X}<Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${names.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels", `${X}<Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `${X}<workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets>${names.map((n, i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `${X}<Relationships xmlns="${NS}/package/2006/relationships">${names.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${names.length + 1}" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", `${X}<styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs></styleSheet>`],
    ...sheets.map((s, i) => [`xl/worksheets/sheet${i + 1}.xml`, sheetXml(s)]),
  ];
  return zipStore(files.map(([name, s]) => ({ name, data:enc.encode(s) })), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}
// Lo que se ve en pantalla, pasado a hojas: el análisis, los números grandes y cada tabla, gráfico de barras o lista del informe.
const cellVal = t => { t = t.replace(/\s+/g, " ").trim(); const m = t.match(/^([+−-]?)(\d{1,3}(?:\.\d{3})*)$/); return m ? (m[1] === "−" || m[1] === "-" ? -1 : 1) * Number(m[2].replace(/\./g, "")) : t; };

    ...(a.sum ? [[{ v:"En resumen", s:1 }], [{ v:plain(a.sum), s:2 }], []] : []),
    ...(a.tips.length ? [[{ v:"Para tener en cuenta", s:1 }], ...a.tips.map(t => [{ v:"• " + plain(t), s:2 }])] : [])] });

  const sheetName = (tb, rows) => { const t = title(tb); if (t) return t; const [h0 = "", h1 = ""] = rows[0].map(c => String(c?.v ?? c ?? ""));
    return /^Campaña/.test(h1) ? "Campañas" : /^Inversión/.test(h1) ? "Inversión por marca" : /al cierre/.test(h1) ? "Seguidores" : /^Trabajos de CM/.test(h0) ? "Trabajos de CM"
      : h0 && h0.length <= 14 ? "Por " + (h0 === h0.toUpperCase() ? h0 : h0.toLowerCase()) : h0 || "Tabla"; };

    if (rows.length > 1) sh.push({ name:sheetName(tb, rows), rows }); });
  body.querySelectorAll(".bars").forEach(b => { const rows = [...b.querySelectorAll(".bar")].map(r => { const sp = r.querySelectorAll(":scope > span"); return [sp[0]?.textContent.trim() || "", cellVal(sp[sp.length - 1]?.textContent || "")]; });
    if (rows.length) sh.push({ name:title(b) || "Gráfico", rows }); });
  body.querySelectorAll(".list").forEach(l => { const rows = [...l.querySelectorAll(".row")].map(r => [r.querySelector(".date")?.textContent.trim() || "", r.querySelector(".t")?.textContent.trim() || "", r.querySelector(".m")?.textContent.replace(/\s+/g, " ").trim() || ""]);
    if (rows.length) sh.push({ name:title(l) || "Lista", rows:[[{ v:"Fecha", s:1 }, { v:"Qué", s:1 }, { v:"Detalle", s:1 }], ...rows] }); });

}
function downloadReport(k, kind){
  const cur = REPORT_TABS.find(t => t.k === k && can(t.perm)); if (!cur) return;
  if (reportTab !== k){ reportTab = k; render(); }
  const name = `Informe_${cur.file}_${monthLabel(MONTH).replace(" ", "_")}`;
  if (kind === "pdf"){
    const t = document.title, html = document.documentElement;
    const done = () => { document.title = t; html.classList.remove("printrep"); window.removeEventListener("afterprint", done); };
    document.title = name; html.classList.add("printrep"); window.addEventListener("afterprint", done);
    setTimeout(() => { if (window.lucide) lucide.createIcons(); window.print(); }, 250);
    return;
  }
  const a = document.createElement("a"), url = URL.createObjectURL(xlsxBlob(reportSheets(cur)));
  a.href = url; a.download = name + ".xlsx"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Listo: se descargó “${name}.xlsx”.`);
}

async function uploadSticker(file){

  if (file.size > 2 * 1024 * 1024) return toast(`La imagen pesa ${(file.size / 1048576).toFixed(1).replace(".", ",")} MB: el máximo es 2 MB. Elegí una más liviana.`);
  if (file.type === "image/gif" && file.size > 400 * 1024) return toast("El GIF pesa más de 400 KB: elegí uno más liviano o más chico.");
  chatUI.stkBusy = true; render();
  try { const img = file.type === "image/gif" ? { type:file.type, data:await fileToB64(file) } : await stkResize(file);
    if (img.data.length * 0.75 > 400 * 1024) throw new Error("Quedó en más de 400 KB: probá con una imagen más simple.");
    const j = await integ({ action:"sticker_upload", name:file.name.replace(/\.[^.]+$/, "").slice(0, 40), ...img });
    if (j.nokey) throw new Error(viewer.role === "Admin total" ? "La biblioteca de Google Drive todavía no está conectada: conectala en Configuración → Integraciones." : "La biblioteca de Google Drive todavía no está conectada (la conecta Admin total).");
    if (!j.ok || !j.sticker) throw new Error(j.error || "No se pudo subir.");
    if (Array.isArray(stkLib)) stkLib.unshift(j.sticker);
    STICKER_FAVS[viewer.id] = ["d:" + j.sticker.id, ...stkFavs()].slice(0, 40); chatUI.stkTab = "fav"; toast("¡Listo! El sticker quedó en la biblioteca y en tus favoritos.");
  } catch (e){ toast(e.message || "No se pudo subir el sticker."); }
  chatUI.stkBusy = false; render();
}
document.addEventListener("change", e => { if (e.target.id === "stkFile" && e.target.files?.[0]) uploadSticker(e.target.files[0]); });

const gifCache = {};
const integ = body => window.RMH?.integ ? RMH.integ(body) : Promise.resolve({ ok:false, error:"Sin conexión" });
function gifPanel(){ return `<div class="gifpanel" role="dialog" aria-label="GIFs"><input class="base" id="gifQ" placeholder="Buscar GIFs…" value="${esc(chatUI.gifQ || "")}" aria-label="Buscar GIFs"><div class="gifgrid" id="gifGrid">${gifGridHTML(chatUI.gifQ || "")}</div></div>`; }
function gifGridHTML(q){
  const r = gifCache[q]; if (!r){ setTimeout(() => gifLoad(q), 0); return `<p class="note">Buscando GIFs…</p>`; }
  if (r === "nokey"){ setTimeout(() => delete gifCache[q], 30000); return `<p class="note">La búsqueda de GIFs todavía no está conectada${viewer.role === "Admin total" ? ": cargá la clave de GIPHY en Configuración → Integraciones" : " (la conecta Admin total)"}.</p>`; }
  if (r === "err") return `<p class="note">No se pudieron cargar los GIFs. Probá de nuevo.</p>`;
  return r.length ? r.map(x => `<button type="button" data-gif="${esc(x.url)}" title="${esc(x.title)}"><img src="${esc(x.preview)}" alt="${esc(x.title || "GIF")}" loading="lazy"></button>`).join("") : `<p class="note">No hay GIFs para “${esc(q)}”.</p>`;
}
async function gifLoad(q){
  if (gifLoad.busy === q) return; gifLoad.busy = q;
  try { const j = await integ({ action:"gifs", q });
    gifCache[q] = j.nokey ? "nokey" : j.ok && Array.isArray(j.gifs) ? j.gifs.filter(x => /^https:\/\//.test(x.url) && /^https:\/\//.test(x.preview)) : "err"; }
  catch { gifCache[q] = "err"; }
  gifLoad.busy = null; if (q === "" && gifCache[q] === "err") setTimeout(() => delete gifCache[q], 10000);
  const g = document.getElementById("gifGrid"); if (g && (chatUI.gifQ || "") === q) g.innerHTML = gifGridHTML(q);
}
let gifT = null;
