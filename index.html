// El contador siempre se anima al instante (también en conversaciones silenciadas); el aviso, solo si no está silenciada.
let chatLastTotal = null, chatLastLoud = null;
function chatNotify(){
  if (!viewer) return; markDelivered(); const n = chatUnreadTotal(), loud = chatUnreadLoud();
  if (chatLastTotal !== null && n > chatLastTotal) setTimeout(bumpChatBadges, 0);
  if (chatLastLoud !== null && loud > chatLastLoud && !isDnd()){
    localNotify(loud);
    if (page !== "mensajes") toast(`Tenés ${n} ${n === 1 ? "mensaje nuevo" : "mensajes nuevos"} en el Chat Retail MKT.`);
  }
  chatLastTotal = n; chatLastLoud = loud;
}
function bumpChatBadges(){

}

const imgToData = file => new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 96; const k = Math.max(96 / im.width, 96 / im.height), w = im.width * k, h = im.height * k; c.getContext("2d").drawImage(im, (96 - w) / 2, (96 - h) / 2, w, h); res(c.toDataURL("image/jpeg", .82)); }; im.src = r.result; }; r.readAsDataURL(file); });

document.addEventListener("input", e => {
  const el = e.target.closest("[data-pf],[data-pm]"); if (!el || page !== "prompts") return;
  if (el.dataset.pm){ const [i, k] = el.dataset.pm.split("|"); promptUI.f.modelos[+i][k] = el.value; }
  else { promptUI.f[el.dataset.pf] = el.dataset.pf === "nModelos" ? +el.value : el.value; if (["ambiente","locacion"].includes(el.dataset.pf)) promptUI.f.esc = "otro"; }
});
document.addEventListener("change", e => { const el = e.target.closest("[data-rr]"); if (!el || page !== "prompts") return; promptUI.f[el.dataset.pf] = el.dataset.pf === "nModelos" ? +el.value : el.value; promptUI.err = ""; render(); });
document.addEventListener("click", e => {
  if (page !== "prompts") return;
  const y = e.target.closest("[data-pyn]"); if (y){ const [k, v] = y.dataset.pyn.split("|"); promptUI.f[k] = v; promptUI.err = ""; render(); return; }
  const pb = e.target.closest("[data-pbrand]"); if (pb){ const b = pb.dataset.pbrand; promptUI.out = ""; promptUI.err = "";
    if (b) pmApplyBrand(b); else { promptUI.f.lastBrand = promptUI.f.brand; promptUI.f.brand = ""; } render(); window.scrollTo({ top:0, behavior:"smooth" });
    if (b === PM_LIBRE) toast("Opción libre: elegís el estilo y la luz vos."); else if (b) toast(`Estilo de ${b} cargado. El prompt lo respeta siempre.`); return; }
  const pfo = e.target.closest("[data-pbfondo]"); if (pfo){ const f = promptUI.f; f.refFondo = pfo.dataset.pbfondo;
    if (f.refFondo === "si" && f.esc) f.fondoTipo = f.esc === "super" ? "super" : "otro"; // el tipo de fondo sigue al escenario elegido
    promptUI.out = ""; promptUI.err = ""; render(); return; }
  const pe = e.target.closest("[data-pbesc]"); if (pe){ const f = promptUI.f, k = pe.dataset.pbesc, x = PM_ESC_BRAND[f.brand]?.[k], B = PM_BRANDS[f.brand];
    const autoDet = d => !d || (B?.modos || []).some(o => o.detalles === d);
    f.esc = k; if (autoDet(f.detalles)) f.detalles = "";
    const set = (amb, fondo, sup) => { if (promptUI.mode === 4) f.locacion = amb; else f.ambiente = amb; f.fondo = fondo; f.superficie = sup; };
    if (x) set(...x); else set("", "", "");
    promptUI.out = ""; promptUI.err = ""; render();
    if (k === "otro") { document.querySelector(promptUI.mode === 4 ? '[data-pf="locacion"]' : '[data-pf="ambiente"]')?.focus(); toast(`Escribí el escenario que quieras: el estilo de ${pmBrandLabel(f)} se mantiene.`); }
    else toast(f.brand === PM_LIBRE ? `Escenario “${PM_ESC.find(e2 => e2[0] === k)[1]}” cargado. Podés cambiarlo.` : `Escenario “${PM_ESC.find(e2 => e2[0] === k)[1]}” con el estilo de ${f.brand}. Podés cambiarlo.`); return; }
  const pbm = e.target.closest("[data-pbmode]"); if (pbm){ const x = PM_BRANDS[promptUI.f.brand]?.modos[+pbm.dataset.pbmode]; if (!x) return; const f = promptUI.f;
    if (promptUI.mode === 4) f.locacion = x.ambiente; else f.ambiente = x.ambiente;
    f.fondo = x.fondo; f.superficie = x.superficie; f.detalles = x.detalles; f.encuadre = x.encuadre; f.esc = ""; promptUI.out = ""; promptUI.err = ""; render(); toast(`Escena “${x.l}” cargada. Podés cambiar lo que quieras.`); return; }
  const m = e.target.closest("[data-pmmode]"); if (m){ promptUI.mode = +m.dataset.pmmode; promptUI.out = ""; promptUI.err = ""; render(); return; }
  if (e.target.closest("[data-pclear]")){ const b = promptUI.f.brand, lm = promptUI.f.libreMarca; promptUI.f = PM_EMPTY(); if (b){ pmApplyBrand(b); promptUI.f.libreMarca = lm; } promptUI.out = ""; promptUI.err = ""; render(); return; }
  const cp = e.target.closest("[data-pcopy],[data-phist]"); if (cp){ const txt = cp.dataset.phist !== undefined ? PROMPT_HISTORY[viewer.id][+cp.dataset.phist].text : $("#promptText").value;
    navigator.clipboard?.writeText(txt).then(() => toast("Prompt copiado. Pegalo en la IA."), () => { const ta = $("#promptText"); if (ta) ta.select(); toast("No se pudo copiar solo: quedó seleccionado, copialo a mano."); }); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "promptForm") return; e.preventDefault();
  const m = promptUI.mode, f = promptUI.f, err = validatePrompt(m, f);
  promptUI.err = err; if (err){ promptUI.out = ""; render(); document.querySelector(".perr")?.scrollIntoView({ block:"center" }); return; }
  promptUI.out = buildPrompt(m, f);
  const title = m === 2 ? f.productos.split("\n").find(x => x.trim()) : m === 6 ? f.libreQue : m === 4 && f.escena !== "featured" ? pmv("escena", f.escena, 1) : f.producto;
  (PROMPT_HISTORY[viewer.id] = PROMPT_HISTORY[viewer.id] || []).unshift({ title:(title || "").trim().slice(0, 80), brand:pmBrandLabel(f), brandKey:f.brand, mode:PM_MODES[m - 1].l, fmt:pmFmtLabel(f), text:promptUI.out, time:nowTime(), at:new Date().toISOString() }); PROMPT_HISTORY[viewer.id].splice(5);
  render(); document.querySelector(".promptout")?.scrollIntoView({ behavior:"smooth", block:"start" }); toast("Prompt listo. Tocá “Copiar prompt”.");
});

  try { const reg = await navigator.serviceWorker.ready, key = await RMH.pushKey(); if (!key) return false;
    let sub = await reg.pushManager.getSubscription(); if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u(key) });
    pushActive = !!(await RMH.pushSave(sub.toJSON())); return pushActive; } catch (e){ console.warn("push", e); return false; }
}
async function enableNotif(){
  if (!notifSupported()) return toast("Este navegador no permite notificaciones. En iPhone: primero instalá la app (pestaña “Instalar la app”) y activalas desde la app instalada.");
  notifBusy = true; render();
  const perm = await Notification.requestPermission();
  if (perm !== "granted"){ notifBusy = false; render(); return toast("No se dio permiso. Habilitá las notificaciones para esta app en los ajustes del navegador o del celular."); }
  try { localStorage.setItem(NOTIF_KEY, "on"); } catch {}
  await pushSubscribe(); notifBusy = false; render();
  toast(pushActive ? "Listo: te van a llegar los mensajes del chat en este dispositivo, aunque la app esté cerrada." : "Listo: te van a llegar avisos en este dispositivo mientras la app esté abierta.");
}
async function disableNotif(){
  try { localStorage.setItem(NOTIF_KEY, "off"); } catch {}
  try { const reg = await navigator.serviceWorker?.getRegistration(), sub = await reg?.pushManager?.getSubscription(); if (sub){ await window.RMH?.pushDel?.(sub.endpoint); await sub.unsubscribe(); } } catch {}
  pushActive = false; render(); toast("Notificaciones apagadas en este dispositivo.");
}

const REVEAL = [".panel", ".tw", ".tw tbody tr:not(.arow)", ".kanban .col", ".kanban .card", ".list > .row", ".row", ".dcard", ".cityrow", ".agebars .ar", ".sexlist .sr", ".tvp", ".tvrow-h", ".monthbar", ".head", ".legend", ".urg-legend", ".pipe .stage", ".prow", ".fbar", ".grid > div", ".chips > .chip", "h1", ".sub", ".eyebrow", ".demo-h", ".bday", ".ro", ".scard", ".staff-grid > *", ".note-card", ".alist > *", ".items > *", ".rtabs", ".hellohead", ".motto", ".jfilters", ".pipe-note", ".tag-row", ".perm", ".fhead", ".demo-wrap", ".tvsum .panel", ".ocard", ".ccard", ".upitem", ".upmonth", ".svcard", ".svrq", ".svq", ".gcard"].join(",");
const CAL_PAGES = ["caldg","calcm","calendario","calhistoria","calcanales","plan","caldiseno","planmes"]; // calendarios: aparecen enteros, sin animación
function reveal(){
  if (viewer.motion === "off" || CAL_PAGES.includes(page)) return;
  if (viewer.motion === "off" || !("IntersectionObserver" in window)) return;
  if (["pedidos","cartel","web","pantallas","gestioncm"].includes(page) && cmUI.tview !== "repetitivos"){ // acá solo se animan las tarjetas (o las filas en la vista Tabla), todas juntas al entrar, columna por columna
    document.querySelectorAll("#content .kanban .col").forEach((col, ci) => col.querySelectorAll(".card").forEach((c, k) => { c.style.animationDelay = (ci * 110 + k * 80) + "ms"; c.classList.add("cardin"); }));
    document.querySelectorAll("#content .tw tbody tr").forEach((r, k) => { r.style.animationDelay = Math.min(k * 40, 700) + "ms"; r.classList.add("cardin"); });
    return; }
  const els = [...document.querySelectorAll("#content " + REVEAL.split(",").join(",#content "))].filter(el => !el.closest(".tvredes, .tvpage, .tvimp, .drawer, #dragMonths, .cal, .calw")); // los calendarios aparecen enteros, sin animación
  const idx = new Map();
  const io = new IntersectionObserver(ents => ents.forEach(en => { if (!en.isIntersecting) return; const el = en.target; io.unobserve(el);
    el.classList.add("in"); const done = e => { if (e.target !== el) return; el.classList.remove("rv","in"); el.removeEventListener("transitionend", done); }; el.addEventListener("transitionend", done);
    setTimeout(() => el.classList.remove("rv","in"), 1400); // por si no llega el transitionend
  }), { threshold:0.08, rootMargin:"0px 0px -4% 0px" });
  // Escalonado por grupo: cada grupo (días de un calendario, filas de una tabla…) tarda como mucho ~0,8 s en completarse.
  const size = new Map(); els.forEach(el => size.set(el.parentElement, (size.get(el.parentElement) || 0) + 1));
  els.forEach(el => { const par = el.parentElement, k = idx.get(par) || 0; idx.set(par, k + 1);
    el.style.setProperty("--rd", Math.round(k * Math.min(45, 800 / size.get(par))) + "ms"); el.classList.add("rv"); io.observe(el); });
}

});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-month],[data-rtab],[data-rbrand],[data-dl],[data-close],[data-page],[data-brand],[data-redes],[data-pedir],[data-adv-post],[data-adv-job],[data-perm],[data-pb],[data-soon]");
  if (!t) return;
  if (["calendario","calhistoria","calcanales"].includes(t.dataset.page) && brandFilter === "Todas") brandFilter = myGroups()[0];
  if (t.dataset.month){ const i = MONTHS_APP.findIndex(m => m.v === MONTH) + Number(t.dataset.month); if (MONTHS_APP[i]){ MONTH = MONTHS_APP[i].v; render(); } }
  else if (t.dataset.rtab){ reportTab = t.dataset.rtab; render(); }
  else if (t.dataset.rbrand){ reportBrand = t.dataset.rbrand; render(); }
  else if (t.dataset.dl){ const [k, kind] = t.dataset.dl.split("|"); downloadReport(k, kind); }
  else if (t.dataset.close !== undefined){ toast(`En la app real, esto deja ${monthName(MONTH)} fijo: se puede consultar pero ya no modificar.`); }
  else if (t.dataset.page){ e.preventDefault(); if (t.dataset.back !== undefined){ navHist.pop(); render.goingBack = true; } if (t.dataset.page !== page) MONTH = CURRENT_MONTH; /* cada sección arranca en el mes actual */ jobUI.ficha = null; jobUI.form = null; if (typeof postUI !== "undefined") postUI.form = null; page = t.dataset.page; render(); window.scrollTo(0,0); } // ir a otra sección cierra el pedido abierto
  else if (t.dataset.brand){ brandFilter = t.dataset.brand; render(); }
  else if (t.dataset.redes){ redesBrand = t.dataset.redes; render(); }
  else if (t.dataset.pedir) pedirDiseno(t.dataset.pedir);
  else if (t.dataset.advPost) advancePost(t.dataset.advPost);
  else if (t.dataset.advJob) advanceJob(t.dataset.advJob);
  else if (t.dataset.perm){
    const [pid, key] = t.dataset.perm.split("|"); const p = PEOPLE.find(x => x.id === pid);
    p.perms.has(key) ? p.perms.delete(key) : p.perms.add(key);
    toast(`${SECTIONS.find(s => s.k === key).l}: ${p.perms.has(key) ? "habilitado" : "oculto"} para ${p.name}.`); render();
  }
  else if (t.dataset.pb){
    const [pid, b] = t.dataset.pb.split("|"); const p = PEOPLE.find(x => x.id === pid);
    let list = p.brands ? [...p.brands] : [...GROUPS];
    list = list.includes(b) ? list.filter(x => x !== b) : [...list, b];
    if (!list.length){ toast("Cada persona tiene que ver al menos una marca."); return; }
    p.brands = list.length === GROUPS.length ? null : GROUPS.filter(x => list.includes(x));
    toast(`${p.name} ahora ve: ${p.brands ? p.brands.join(", ") : "todas las marcas"}.`); render();
  }
  else if (t.dataset.soon !== undefined) toast("En la maqueta este botón no hace nada; en la app real sí.");
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-owner]"); if (!s) return;
  const j = jobs.find(x => x.id === s.dataset.owner); j.owner = s.value;
  toast(`${j.title}: asignado a ${j.owner}.`); render();
});
render();
</script>
